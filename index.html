<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2865e8" />
  <title>Sleep Kitchen Planner</title>
  <style>
    :root{--blue:#2865e8;--ink:#14203a;--muted:#69758a;--line:#e5e9f2;--bg:#f5f7fc;--card:#fff;--soft:#eef3ff;--danger:#bf3942;--gold:#ae7400}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} button,input,select{font:inherit} button{cursor:pointer;border:0}
    .app{max-width:1080px;margin:auto;padding:0 14px 44px} header{position:sticky;top:0;z-index:5;margin:0 -14px 16px;padding:14px max(16px,calc((100vw - 1050px)/2));background:linear-gradient(125deg,#2257dc,#3678f1);color:#fff;box-shadow:0 3px 14px #10255d33}
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;margin:2px 0 0;opacity:.86}.gear{font-size:22px;border-radius:12px;background:#ffffff26;color:#fff;padding:8px 11px}.tabs{display:flex;gap:8px;overflow:auto;margin-top:12px}.tabs button{color:#fff;background:#ffffff29;border-radius:999px;padding:8px 14px;white-space:nowrap;font-weight:800}.tabs button.active{background:#fff;color:var(--blue)}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 3px 12px #26334e0a}.title{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:0 0 10px;font-size:17px}.title small{font-size:12px;color:var(--muted);font-weight:500}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{font-size:12px;color:var(--muted);font-weight:800;display:block;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #ccd4e4;border-radius:10px;padding:9px;background:#fff;color:var(--ink)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--soft);border-radius:13px;padding:10px}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted);line-height:1.2;display:block}.meal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.meal{border:1px solid var(--line);border-radius:14px;padding:11px}.meal h3{font-size:14px;margin:0 0 7px}.meal-name{font-size:14px;font-weight:800;min-height:38px}.status{font-size:12px;color:var(--muted);margin:6px 0}.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.primary,.secondary,.danger{font-size:13px;border-radius:10px;padding:8px 10px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#edf1fa;color:var(--ink)}.danger{background:#ffedef;color:var(--danger)}
    .priority-list,.inventory-list{display:grid;gap:7px}.priority{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:9px;border-radius:11px;background:#fafbff}.icon{width:25px;height:25px;object-fit:contain;vertical-align:middle}.timeline-icon{width:25px;height:25px;object-fit:contain}.name{font-weight:800}.sub{font-size:12px;color:var(--muted)}.badge{background:#fff1d9;color:#895700;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.badge.urgent{background:#ffe8ea;color:#a92d35}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.toolbar input{min-width:150px;flex:1;border:1px solid #ccd4e4;border-radius:10px;padding:10px}.toolbar select{border:1px solid #ccd4e4;border-radius:10px;padding:9px;background:#fff}.toggle{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #ccd4e4;border-radius:10px;padding:8px 9px;font-weight:750;font-size:13px}.recipes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.recipe{border:1px solid var(--line);border-radius:18px;background:#fff;padding:12px;overflow:hidden}.recipe.over{opacity:.42}.recipe-top{display:flex;gap:9px;align-items:center}.dish{width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:#fff2dc;overflow:hidden;flex:none}.dish img{width:100%;height:100%;object-fit:contain}.recipe h3{font-size:15px;margin:0;line-height:1.15}.category{font-size:10px;color:#866013;font-weight:900;margin-top:4px;text-transform:uppercase}.ing-total{font-size:18px;font-weight:950;margin:10px 0 4px}.power{font-size:13px;color:var(--muted)}.power b{color:var(--ink)}.ings{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.ing{display:flex;gap:4px;align-items:center;font-size:13px;background:#f3f5f9;border-radius:999px;padding:4px 7px;font-weight:800;white-space:nowrap}.ing img{width:19px;height:19px;object-fit:contain}.select{width:100%;margin-top:2px}
    .inventory-row{display:grid;grid-template-columns:28px 1fr 84px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f2f7}.inventory-row input{width:100%;border:1px solid #ccd4e4;border-radius:9px;padding:7px}.hint{font-size:12px;color:var(--muted);line-height:1.45}.empty{color:var(--muted);font-size:14px;padding:10px 0}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}
    .backdrop{position:fixed;inset:0;background:#10182a70;z-index:20;display:none}.backdrop.show{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);background:#fff;z-index:21;transform:translateX(105%);transition:transform .22s ease;overflow:auto;padding:18px;box-shadow:-8px 0 25px #10182a22}.drawer.show{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawer-head h2{margin:0}.close{background:none;font-size:31px;color:#718096}.divider{height:1px;background:var(--line);margin:16px 0}.stepper{display:grid;grid-template-columns:52px 1fr 52px;border:1px solid #bfc8d8;border-radius:11px;overflow:hidden}.stepper button{background:#f8f9fc;font-size:24px;color:#657086}.stepper input{border:0;border-left:1px solid #d8ddea;border-right:1px solid #d8ddea;text-align:center;padding:9px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.check{display:flex;align-items:center;gap:7px;border:1px solid #edf0f5;border-radius:10px;padding:7px;font-size:13px}.check img{width:22px;height:22px;object-fit:contain}
    .modal-back{position:fixed;inset:0;background:#10182a73;z-index:30;display:none;align-items:flex-end;justify-content:center}.modal-back.show{display:flex}.modal{width:min(640px,100%);max-height:91vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.modal h2{font-size:19px;margin:0 0 10px}.base{display:flex;align-items:center;gap:7px;background:#f5f7fb;padding:10px;border-radius:10px;margin:6px 0}.base img{width:24px;height:24px;object-fit:contain}.filler{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;padding:6px 0}.filler input{width:100%;border:1px solid #ccd4e4;border-radius:9px;padding:7px}.review{display:grid;grid-template-columns:28px 1fr 85px;gap:8px;align-items:center;border-bottom:1px solid #eef0f5;padding:8px 0}.review input{border:1px solid #ccd4e4;border-radius:9px;padding:7px;width:100%}
    .loading{padding:30px;text-align:center;color:var(--muted)}.error{margin:20px auto;max-width:700px;background:#fff0f1;border:1px solid #ffd2d5;border-radius:14px;padding:16px;color:#8f2830}.error code{display:block;background:#fff;padding:8px;border-radius:7px;margin-top:8px;color:#4b5565;overflow:auto}
    @media(max-width:620px){.app{padding:0 10px 32px}header{margin:0 -10px 14px;padding:13px 14px}.controls{grid-template-columns:1fr 1fr}.controls .field:last-child{grid-column:span 2}.meal-grid{grid-template-columns:1fr}.recipes{gap:8px}.recipe{padding:10px}.dish{width:43px;height:43px}.recipe h3{font-size:13px}.ing-total{font-size:16px}.ing{font-size:12px;padding:3px 6px}.stat{padding:8px}.stat b{font-size:18px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="top"><div class="brand"><h1>Sleep Kitchen Planner</h1><p>Private meal and ingredient planner</p></div><button id="gear" class="gear" aria-label="Settings">⚙</button></div>
      <nav class="tabs"><button data-tab="today">Today</button><button data-tab="plan">Plan</button><button data-tab="recipes">Recipes</button><button data-tab="ingredients">Ingredients</button></nav>
    </header>
    <main id="content"><div class="loading">Loading recipes and ingredient images…</div></main>
  </div>
  <div id="backdrop" class="backdrop"></div><aside id="drawer" class="drawer"></aside><div id="modalBack" class="modal-back"><div id="modal" class="modal"></div></div>

<script>
/*
  Required repository layout:
    /data/ingredients.json
    /data/recipes.json
    /assets/images/ingredient/<ingredient-file>.png
    /assets/images/curry/<recipe-file>.png
    /assets/images/salads/<recipe-file>.png
    /assets/images/dessert/<recipe-file>.png

  The app normalizes a range of likely JSON field names. If your JSON schema differs,
  adjust only normalizeIngredient() and normalizeRecipe() below.
*/

const LEVEL_BONUS = {
  1:0,2:2,3:4,4:6,5:8,6:9,7:11,8:13,9:16,10:18,11:19,12:21,13:23,14:24,15:26,16:28,17:30,18:31,19:33,20:35,
  21:37,22:40,23:42,24:45,25:47,26:50,27:52,28:55,29:58,30:61,31:64,32:67,33:70,34:74,35:77,36:81,37:84,38:88,39:92,40:96,
  41:100,42:104,43:108,44:113,45:117,46:122,47:127,48:132,49:137,50:142,51:148,52:153,53:159,54:165,55:171,56:177,57:183,58:190,59:197,60:203,
  61:209,62:215,63:221,64:227,65:234
};

let RAW_INGREDIENTS = [];
let RAW_RECIPES = [];
let ingredients = [];
let recipes = [];
let I = {};

const defaultState = {
  tab:'today', pot:32, category:'Curry / Stew', showOver:true,
  enabled:{}, inventory:{}, levels:{}, plans:{}, selectedSlot:null
};
let state = JSON.parse(localStorage.getItem('sleepKitchenV3') || 'null') || structuredClone(defaultState);
state.enabled ||= {}; state.inventory ||= {}; state.levels ||= {}; state.plans ||= {};

function slug(value='') {
  return String(value).toLowerCase()
    .replace(/[“”"']/g,'').replace(/&/g,' and ')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function asArray(value) {
  if (Array.isArray(value)) return value;
  if (value && typeof value === 'object') return Object.values(value);
  return [];
}
function assetUrl(path) {
  if (!path) return '';
  if (/^(https?:|data:|\/)/.test(path)) return path;
  return './' + path.replace(/^\.\//,'');
}
function findField(obj, names, fallback='') {
  for (const name of names) if (obj && obj[name] !== undefined && obj[name] !== null) return obj[name];
  return fallback;
}
function categoryName(value='') {
  const v = String(value).toLowerCase();
  if (v.includes('salad')) return 'Salad';
  if (v.includes('dessert') || v.includes('drink')) return 'Dessert / Drink';
  return 'Curry / Stew';
}
function categoryFolder(cat) {
  return cat === 'Salad' ? 'salads' : cat === 'Dessert / Drink' ? 'dessert' : 'curry';
}
function inferIngredientImage(raw, id) {
  const supplied = findField(raw,['image','imagePath','image_url','icon','iconPath','sprite']);
  return supplied ? assetUrl(supplied) : `./assets/images/ingredient/${slug(id)}.png`;
}
function inferRecipeImage(raw, id, cat) {
  const supplied = findField(raw,['image','imagePath','image_url','dishImage','dish_image','icon','sprite']);
  return supplied ? assetUrl(supplied) : `./assets/images/${categoryFolder(cat)}/${slug(id)}.png`;
}
function normalizeIngredient(raw) {
  const name = findField(raw,['name','displayName','ingredientName','title'],'Unknown Ingredient');
  const id = slug(findField(raw,['id','key','slug','identifier'],name));
  return {id,name,image:inferIngredientImage(raw,id)};
}
function rawIngredientId(value) {
  if (typeof value === 'string') return slug(value);
  if (!value || typeof value !== 'object') return '';
  return slug(findField(value,['id','ingredientId','ingredient_id','key','slug','name','ingredient'],''));
}
function normalizeIngredients(rawIngredients) {
  const result = {};
  if (Array.isArray(rawIngredients)) {
    rawIngredients.forEach(entry => {
      const id = rawIngredientId(entry);
      const q = Number(findField(entry,['quantity','amount','count','qty','value'],1)) || 0;
      if (id) result[id] = (result[id] || 0) + q;
    });
  } else if (rawIngredients && typeof rawIngredients === 'object') {
    Object.entries(rawIngredients).forEach(([key,value]) => {
      const id = rawIngredientId(value) || slug(key);
      const q = typeof value === 'number' ? value : Number(findField(value,['quantity','amount','count','qty','value'],0));
      if (id && q) result[id] = (result[id] || 0) + q;
    });
  }
  return result;
}
function normalizeRecipe(raw) {
  const name = findField(raw,['name','displayName','recipeName','title'],'Unknown Recipe');
  const id = slug(findField(raw,['id','key','slug','identifier'],name));
  const cat = categoryName(findField(raw,['category','type','dishType','dish_type','recipeType'],'Curry / Stew'));
  const base = Number(findField(raw,['baseStrength','base_strength','basePower','base_power','strength','power','recipeStrength'],0)) || 0;
  const rawIngredients = findField(raw,['ingredients','recipeIngredients','recipe_ingredients','requirements','ingredientList'],{});
  return {id,name,cat,base,ings:normalizeIngredients(rawIngredients),image:inferRecipeImage(raw,id,cat)};
}
function unwrapDataset(data) {
  if (Array.isArray(data)) return data;
  if (data && typeof data === 'object') {
    for (const key of ['ingredients','recipes','data','results','items']) if (Array.isArray(data[key])) return data[key];
    return Object.values(data);
  }
  return [];
}
function save(){localStorage.setItem('sleepKitchenV3',JSON.stringify(state))}
function total(r){return Object.values(r.ings).reduce((a,b)=>a+b,0)}
function recipe(id){return recipes.find(r=>r.id===id)}
function powered(r){const lv=state.levels[r.id];return lv ? Math.round(r.base*(1+(LEVEL_BONUS[lv]||0)/100)) : r.base}
function allowed(r){return Object.keys(r.ings).every(id=>state.enabled[id])}
function imageFallback(el){el.style.display='none'; const parent=el.parentElement; if(parent && !parent.textContent.trim()) parent.textContent='🍽️'}
function ingredientIcon(id, className='icon') { const x=I[id]; return x ? `<img class="${className}" src="${x.image}" alt="${x.name}" title="${x.name}" onerror="imageFallback(this)">` : `<span title="${id}">❔</span>` }
function iconList(ings){return Object.entries(ings).map(([id,q])=>`<span class="ing" title="${I[id]?.name || id}">${ingredientIcon(id)} ${q}</span>`).join('')}
function day(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}
function dk(d){return d.toISOString().slice(0,10)}
function label(n){return n===0?'Today':n===1?'Tomorrow':day(n).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function slots(range=7){const out=[];for(let d=0;d<range;d++) for(const meal of ['Breakfast','Lunch','Dinner']) out.push({day:d,meal,label:label(d),key:dk(day(d))+'-'+meal});return out}
function needs(range=7){const n={};slots(range).forEach(s=>{const p=state.plans[s.key],r=p&&recipe(p.recipe);if(p&&!p.cooked&&r)Object.entries(r.ings).forEach(([id,q])=>n[id]=(n[id]||0)+q)});return n}
function shortageTimeline(){const bal={...state.inventory},out=[];slots(7).forEach(s=>{const p=state.plans[s.key],r=p&&recipe(p.recipe);if(!p||p.cooked||!r)return;Object.entries(r.ings).forEach(([id,q])=>{bal[id]=(bal[id]||0)-q;if(bal[id]<0&&!out.some(x=>x.id===id))out.push({id,short:-bal[id],slot:s})})});return out}
function setTab(t){state.tab=t;save();render()}

function recipeCard(r, selectable=true) {
  const over=total(r)>state.pot;
  return `<article class="recipe ${over?'over':''}">
    <div class="recipe-top"><div class="dish"><img src="${r.image}" alt="${r.name}" onerror="imageFallback(this)"></div><div><h3>${r.name}</h3><div class="category">${r.cat}</div></div></div>
    <div class="ing-total">${total(r)} INGREDIENTS</div>
    <div class="power">Lv. ${state.levels[r.id]||'—'} · Recipe Strength: <b>${powered(r).toLocaleString()}</b></div>
    <div class="ings">${iconList(r.ings)}</div>
    ${selectable?`<button class="primary select" data-pick="${r.id}">Select recipe</button>`:''}
  </article>`;
}
function mealCard(s){const p=state.plans[s.key],r=p&&recipe(p.recipe);return `<div class="meal"><h3>${s.meal}</h3>${r?`<div class="meal-name">${r.name}</div><div class="status">${p.cooked?'Cooked':'Planned'} · ${total(r)} ingredients</div><div class="row">${p.cooked?'<button class="secondary" disabled>Cooked</button>':`<button class="primary" data-cook="${s.key}">Mark cooked</button>`}<button class="secondary" data-select="${s.key}">Change</button></div>`:`<div class="meal-name">No recipe selected</div><div class="status">Choose a recipe</div><button class="primary" data-select="${s.key}">Select recipe</button>`}</div>`}
function today(){const n=needs(1),missing=Object.entries(n).reduce((a,[id,q])=>a+Math.max(0,q-(state.inventory[id]||0)),0),short=shortageTimeline().slice(0,4);return `<div class="panel"><h2 class="title">Today <small>${day(0).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</small></h2><div class="controls"><div class="field"><label>Weekly category</label><select id="cat"><option>Curry / Stew</option><option>Salad</option><option>Dessert / Drink</option></select></div><div class="field"><label>Normal pot capacity</label><input id="pot" type="number" min="1" max="200" value="${state.pot}"></div><div class="field"><label>Recipe catalog</label><input value="Accessible recipes" disabled></div></div></div><div class="stats"><div class="stat"><b>${Object.values(n).reduce((a,b)=>a+b,0)}</b><span>Ingredients needed today</span></div><div class="stat"><b>${missing}</b><span>Missing for remaining meals</span></div><div class="stat"><b>${slots(7).filter(s=>state.plans[s.key]&&!state.plans[s.key].cooked).length}</b><span>Upcoming planned meals</span></div></div><div class="panel"><h2 class="title">Remaining meals <small>All choices stay editable until cooked</small></h2><div class="meal-grid">${slots(1).map(mealCard).join('')}</div></div><div class="panel"><h2 class="title">Plan ahead <small>First shortages in your next 7 days</small></h2>${short.length?`<div class="priority-list">${short.map(x=>`<div class="priority">${ingredientIcon(x.id,'timeline-icon')}<div><div class="name">${I[x.id]?.name||x.id}</div><div class="sub">Need ${x.short} more by ${x.slot.label} ${x.slot.meal}</div></div><span class="badge ${x.slot.day<2?'urgent':''}">${x.slot.day===0?'Today':x.slot.day===1?'Tomorrow':'Later'}</span></div>`).join('')}</div>`:'<div class="empty">Your current planned base recipes are covered.</div>'}<div class="row" style="margin-top:12px"><button class="secondary" data-go="ingredients">Full ingredient timeline</button></div></div>`}
function plan(){return slots(7).reduce((html,s,i)=>{if(i%3===0)html+=`<div class="panel"><h2 class="title">${s.label}<small>${day(s.day).toLocaleDateString(undefined,{weekday:'long'})}</small></h2><div class="meal-grid">`;html+=mealCard(s);if(i%3===2)html+='</div></div>';return html},'')}
function recipeView(){return `<div class="panel"><h2 class="title">Recipes <small>Only recipes using enabled ingredients</small></h2><div class="toolbar"><input id="search" placeholder="Search recipes…"><label class="toggle"><input id="makeable" type="checkbox"> What can I make?</label><select id="sort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select><button class="secondary" id="master">Master list</button></div><div id="recipeGrid" class="recipes"></div></div>`}
function drawRecipes({master=false,target='recipeGrid',picker=false}={}){
  const root=document.getElementById(target);if(!root)return;
  const q=(document.getElementById(picker?'pickerSearch':'search')?.value||'').toLowerCase();
  const makeable=document.getElementById(picker?'pickerMakeable':'makeable')?.checked;
  const sort=document.getElementById(picker?'pickerSort':'sort')?.value||'power';
  let list=recipes.filter(r=>(master||allowed(r))&&r.name.toLowerCase().includes(q));
  if(!master&&!state.showOver)list=list.filter(r=>total(r)<=state.pot);
  if(makeable)list=list.filter(r=>total(r)<=state.pot&&Object.entries(r.ings).every(([id,n])=>(state.inventory[id]||0)>=n));
  list.sort((a,b)=>sort==='power'?powered(b)-powered(a):sort==='ingredients'?total(b)-total(a):a.name.localeCompare(b.name));
  root.innerHTML=list.length?list.map(r=>recipeCard(r,!master)).join(''):'<div class="empty">No recipes match these filters.</div>';
  root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>chooseRecipe(b.dataset.pick));
}
function ingredientsView(){const n=needs(),surplus=ingredients.map(x=>({x,q:Math.max(0,(state.inventory[x.id]||0)-(n[x.id]||0))})).filter(x=>x.q>0),short=shortageTimeline();return `<div class="panel"><h2 class="title">Ingredient inventory <small>Update manually or import screenshots</small></h2><div class="row"><button class="primary" id="upload">Upload bag screenshots</button><button class="secondary" id="openDrawer">Ingredient settings</button></div><p class="hint">Screenshot import currently provides a private review/correction step. Select screenshots, then confirm the numbers you want to save.</p><div class="inventory-list">${ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="inventory-row">${ingredientIcon(x.id)}<label>${x.name}</label><input data-inv="${x.id}" type="number" min="0" value="${state.inventory[x.id]||0}"></div>`).join('')}</div><div class="footer"><button class="primary" id="saveInventory">Save inventory</button></div></div><div class="panel"><h2 class="title">Ingredient timeline <small>Bag versus unfinished planned base recipes</small></h2>${short.length?`<div class="priority-list">${short.map(x=>`<div class="priority">${ingredientIcon(x.id,'timeline-icon')}<div><div class="name">${I[x.id]?.name||x.id}</div><div class="sub">Short ${x.short} starting ${x.slot.label} ${x.slot.meal}</div></div><span class="badge ${x.slot.day<2?'urgent':''}">${x.slot.day===0?'Today':x.slot.day===1?'Tomorrow':'Later'}</span></div>`).join('')}</div>`:'<div class="empty">No shortages in the selected seven-day plan.</div>'}</div><div class="panel"><h2 class="title">Filler surplus <small>Current bag minus planned base recipes</small></h2>${surplus.length?`<div class="ings">${surplus.map(({x,q})=>`<span class="ing" title="${x.name}">${ingredientIcon(x.id)} ${q}</span>`).join('')}</div>`:'<div class="empty">No filler surplus right now.</div>'}</div>`}
function render(){document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.tab);b.onclick=()=>setTab(b.dataset.tab)});const c=document.getElementById('content');c.innerHTML=state.tab==='today'?today():state.tab==='plan'?plan():state.tab==='recipes'?recipeView():ingredientsView();bind()}
function bind(){document.getElementById('gear').onclick=openDrawer;document.getElementById('openDrawer')&&(document.getElementById('openDrawer').onclick=openDrawer);document.getElementById('cat')?.addEventListener('change',e=>{state.category=e.target.value;save();render()});if(document.getElementById('cat'))document.getElementById('cat').value=state.category;document.getElementById('pot')?.addEventListener('change',e=>{state.pot=Math.max(1,+e.target.value||1);save();render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>openPicker(b.dataset.select));document.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>openCook(b.dataset.cook));if(state.tab==='recipes'){drawRecipes();['search','makeable','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',()=>drawRecipes()));document.getElementById('master').onclick=openMaster}document.getElementById('saveInventory')?.addEventListener('click',()=>{document.querySelectorAll('[data-inv]').forEach(el=>state.inventory[el.dataset.inv]=Math.max(0,+el.value||0));save();render()});document.getElementById('upload')?.addEventListener('click',openUpload)}
function openDrawer(){const enabled=ingredients.filter(x=>state.enabled[x.id]).length;document.getElementById('drawer').innerHTML=`<div class="drawer-head"><h2>Settings</h2><button id="closeDrawer" class="close">×</button></div><div class="field"><label>Weekly category</label><select id="dcat"><option>Curry / Stew</option><option>Salad</option><option>Dessert / Drink</option></select></div><div class="divider"></div><div class="field"><label>Normal cooking pot size</label><div class="stepper"><button id="minus">−</button><input id="dpot" type="number" min="1" max="200" value="${state.pot}"><button id="plus">+</button></div></div><div class="divider"></div><label class="toggle"><input id="showOver" type="checkbox" ${state.showOver?'checked':''}> Show recipes over normal pot size</label><div class="divider"></div><h3 style="margin:0 0 6px">Available ingredients</h3><p class="hint">${enabled} / ${ingredients.length} enabled. Disabled ingredients hide their recipes from normal browsing, meal selection, and “What can I make?” Recipes remain in the Master List.</p><div class="checks">${ingredients.map(x=>`<label class="check"><input type="checkbox" data-enabled="${x.id}" ${state.enabled[x.id]?'checked':''}> ${ingredientIcon(x.id)} <span>${x.name}</span></label>`).join('')}</div><div class="divider"></div><div class="row"><button class="secondary" id="drawerMaster">Master recipe list</button><button class="secondary" id="drawerUpload">Import screenshots</button></div><div class="divider"></div><p class="hint">Your personal data is stored only in this browser.</p><div class="row"><button class="secondary" id="export">Export backup</button><label class="secondary">Import backup<input id="import" type="file" accept="application/json" hidden></label><button class="danger" id="reset">Reset</button></div>`;document.getElementById('dcat').value=state.category;document.getElementById('drawer').classList.add('show');document.getElementById('backdrop').classList.add('show');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('backdrop').onclick=closeDrawer;document.getElementById('minus').onclick=()=>{state.pot=Math.max(1,state.pot-1);save();openDrawer();render()};document.getElementById('plus').onclick=()=>{state.pot++;save();openDrawer();render()};document.getElementById('dpot').onchange=e=>{state.pot=Math.max(1,+e.target.value||1);save();render()};document.getElementById('dcat').onchange=e=>{state.category=e.target.value;save();render()};document.getElementById('showOver').onchange=e=>{state.showOver=e.target.checked;save();render()};document.querySelectorAll('[data-enabled]').forEach(el=>el.onchange=()=>{state.enabled[el.dataset.enabled]=el.checked;save();openDrawer();render()});document.getElementById('drawerMaster').onclick=()=>{closeDrawer();openMaster()};document.getElementById('drawerUpload').onclick=()=>{closeDrawer();openUpload()};document.getElementById('export').onclick=exportData;document.getElementById('import').onchange=importData;document.getElementById('reset').onclick=()=>{if(confirm('Reset all local app data?')){state=structuredClone(defaultState);initializeState();save();closeDrawer();render()}}}
function closeDrawer(){document.getElementById('drawer').classList.remove('show');document.getElementById('backdrop').classList.remove('show')}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBack').classList.add('show');document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}}function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function openMaster(){openModal(`<h2>Master Recipe List</h2><p class="hint">All catalog recipes appear here, including recipes requiring disabled ingredients. This view is for reference only.</p><div class="toolbar"><input id="search" placeholder="Search master list…"><select id="sort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select></div><div id="recipeGrid" class="recipes"></div><div class="footer"><button id="closeMaster" class="secondary">Close</button></div>`);drawRecipes({master:true});document.getElementById('search').oninput=()=>drawRecipes({master:true});document.getElementById('sort').onchange=()=>drawRecipes({master:true});document.getElementById('closeMaster').onclick=closeModal}
function openPicker(slot){state.selectedSlot=slot;const s=slots(7).find(x=>x.key===slot);openModal(`<h2>Select recipe for ${s.label} ${s.meal}</h2><div class="toolbar"><input id="pickerSearch" placeholder="Search accessible recipes…"><label class="toggle"><input id="pickerMakeable" type="checkbox"> What can I make?</label><select id="pickerSort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select></div><div id="pickerGrid" class="recipes"></div><div class="footer"><button id="cancelPicker" class="secondary">Cancel</button></div>`);drawRecipes({target:'pickerGrid',picker:true});['pickerSearch','pickerMakeable','pickerSort'].forEach(id=>document.getElementById(id).addEventListener(id==='pickerSearch'?'input':'change',()=>drawRecipes({target:'pickerGrid',picker:true})));document.getElementById('cancelPicker').onclick=closeModal}
function chooseRecipe(id){if(!state.selectedSlot){alert('Select a meal slot first.');return}state.plans[state.selectedSlot]={recipe:id,cooked:false};save();closeModal();render()}
function openCook(slot){const p=state.plans[slot],r=recipe(p.recipe);openModal(`<h2>Mark cooked</h2><p class="hint">Confirm the base recipe and enter only the fillers you actually used. Filler strength is not calculated.</p><h3>Base recipe</h3>${Object.entries(r.ings).map(([id,q])=>`<div class="base">${ingredientIcon(id)} ${I[id]?.name||id}: <b>${q}</b></div>`).join('')}<h3>Add fillers used</h3>${ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="filler"><label>${ingredientIcon(x.id)} ${x.name}</label><input data-fill="${x.id}" type="number" min="0" value="0"></div>`).join('')}<div class="footer"><button id="cancelCook" class="secondary">Cancel</button><button id="confirmCook" class="primary">Confirm cooked</button></div>`);document.getElementById('cancelCook').onclick=closeModal;document.getElementById('confirmCook').onclick=()=>{const used={...r.ings};document.querySelectorAll('[data-fill]').forEach(el=>{const q=Math.max(0,+el.value||0);if(q)used[el.dataset.fill]=(used[el.dataset.fill]||0)+q});Object.entries(used).forEach(([id,q])=>state.inventory[id]=Math.max(0,(state.inventory[id]||0)-q));p.cooked=true;save();closeModal();render()}}
function openUpload(){openModal(`<h2>Import bag screenshots</h2><p class="hint">Choose one or more Pokémon Sleep bag screenshots. This version provides the private review and correction workflow; it does not automatically read image counts yet.</p><input id="shots" type="file" accept="image/*" multiple><div id="preview" class="hint" style="margin-top:10px"></div><div id="reviewRows" style="margin-top:10px"></div><div class="footer"><button id="cancelUpload" class="secondary">Cancel</button><button id="applyUpload" class="primary">Apply confirmed counts</button></div>`);document.getElementById('cancelUpload').onclick=closeModal;document.getElementById('shots').onchange=e=>{const files=[...e.target.files];document.getElementById('preview').textContent=files.length?`${files.length} screenshot${files.length>1?'s':''} selected. Confirm the inventory values below.`:'No screenshots selected.';document.getElementById('reviewRows').innerHTML=ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="review">${ingredientIcon(x.id)}<label>${x.name}</label><input data-import="${x.id}" type="number" min="0" value="${state.inventory[x.id]||0}"></div>`).join('')};document.getElementById('applyUpload').onclick=()=>{document.querySelectorAll('[data-import]').forEach(el=>state.inventory[el.dataset.import]=Math.max(0,+el.value||0));save();closeModal();render()}}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='sleep-kitchen-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);initializeState();save();closeDrawer();render();alert('Backup imported.')}catch{alert('That file could not be read as a backup.')}};r.readAsText(f)}
function initializeState(){
  ingredients.forEach(x=>{if(state.enabled[x.id]===undefined)state.enabled[x.id]=true;if(state.inventory[x.id]===undefined)state.inventory[x.id]=0});
  if(!['Curry / Stew','Salad','Dessert / Drink'].includes(state.category)) state.category='Curry / Stew';
}
async function loadData(){
  try{
    const [ingResponse,recipeResponse]=await Promise.all([fetch('./data/ingredients.json'),fetch('./data/recipes.json')]);
    if(!ingResponse.ok)throw new Error(`Could not load data/ingredients.json (${ingResponse.status})`);
    if(!recipeResponse.ok)throw new Error(`Could not load data/recipes.json (${recipeResponse.status})`);
    const [ingData,recipeData]=await Promise.all([ingResponse.json(),recipeResponse.json()]);
    RAW_INGREDIENTS=unwrapDataset(ingData); RAW_RECIPES=unwrapDataset(recipeData);
    ingredients=RAW_INGREDIENTS.map(normalizeIngredient).filter(x=>x.id);
    I=Object.fromEntries(ingredients.map(x=>[x.id,x]));
    recipes=RAW_RECIPES.map(normalizeRecipe).filter(r=>r.id&&r.name&&Object.keys(r.ings).length);
    if(!ingredients.length)throw new Error('No ingredients were found in data/ingredients.json.');
    if(!recipes.length)throw new Error('No recipes were found in data/recipes.json. Check normalizeRecipe() field names.');
    initializeState(); save(); render();
  }catch(error){
    document.getElementById('content').innerHTML=`<div class="error"><b>The planner could not load its recipe data.</b><br>${error.message}<br><code>Expected files: ./data/ingredients.json and ./data/recipes.json</code><p>Open the browser developer console or check GitHub Pages paths if this is deployed. If your JSON uses different field names, update <code>normalizeIngredient()</code> and <code>normalizeRecipe()</code> near the top of index.html.</p></div>`;
    console.error(error);
  }
}
loadData();
</script>
