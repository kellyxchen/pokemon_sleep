<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Cooking Planner</title>
  <style>
    :root{--blue:#2865e8;--blue-soft:#eef4ff;--ink:#16213a;--muted:#69758a;--line:#e5e9f2;--bg:#ffffff;--card:#ffffff;--soft:#f6f8fc;--danger:#bf3942;--danger-soft:#fff0f1;--success:#16803c;--success-soft:#edf9f0;--gold:#996300}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1120px;margin:auto;padding:0 18px 48px}
    header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);margin:0 -18px 18px;padding:12px 18px 0;box-shadow:0 2px 12px #26334e0a}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:54px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.app-logo{height:48px;width:auto;max-width:145px;object-fit:contain;display:block}.brand-copy h1{font-size:20px;margin:0;letter-spacing:-.2px}.brand-copy p{font-size:12px;margin:2px 0 0;color:var(--muted)}
    .gear{width:42px;height:42px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;background:#fff;color:var(--ink);flex:none}.gear:hover{background:var(--soft)}.gear svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{position:relative;color:var(--muted);background:transparent;padding:10px 15px 12px;white-space:nowrap;font-weight:800;border-radius:8px 8px 0 0}.tabs button.active{color:var(--blue)}.tabs button.active:after{content:"";position:absolute;height:3px;background:var(--blue);border-radius:3px 3px 0 0;bottom:0;left:13px;right:13px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #26334e08}.title{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:0 0 11px;font-size:17px}.title small{font-size:12px;color:var(--muted);font-weight:500}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field label{font-size:12px;color:var(--muted);font-weight:800;display:block;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #ccd4e4;border-radius:10px;padding:9px;background:#fff;color:var(--ink)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--soft);border-radius:13px;padding:11px}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted);line-height:1.2;display:block}.meal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.meal{border:1px solid var(--line);border-radius:14px;padding:12px}.meal h3{font-size:14px;margin:0 0 7px}.meal-name{font-size:14px;font-weight:850;min-height:20px}.status{font-size:12px;color:var(--muted);margin:7px 0}.planned-recipe{display:grid;grid-template-columns:58px minmax(0,1fr);column-gap:10px;align-items:center;margin:7px 0 9px}.planned-dish-image{width:58px;height:58px;object-fit:contain;border-radius:12px;background:#fff7e8;padding:3px}.planned-recipe .meal-name{align-self:end}.meal-ingredients{grid-column:2;margin:5px 0 0}
    .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.primary,.secondary,.danger{font-size:13px;border-radius:10px;padding:8px 10px;font-weight:800}.primary{background:var(--blue);color:#fff}.primary:hover{background:#1e56d3}.secondary{background:#f1f4fa;color:var(--ink)}.secondary:hover{background:#e7ebf4}.danger{background:#ffedef;color:var(--danger)}
    .priority-list,.inventory-list{display:grid;gap:7px}.priority{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:9px;border-radius:11px;background:#fafbff}.icon{width:25px;height:25px;object-fit:contain;vertical-align:middle}.timeline-icon{width:25px;height:25px;object-fit:contain}.name{font-weight:800}.sub{font-size:12px;color:var(--muted)}.badge{background:#fff1d9;color:#895700;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.badge.urgent{background:#ffe8ea;color:#a92d35}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.toolbar input{min-width:150px;flex:1;border:1px solid #ccd4e4;border-radius:10px;padding:10px}.toolbar select{border:1px solid #ccd4e4;border-radius:10px;padding:9px;background:#fff}.toggle{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #ccd4e4;border-radius:10px;padding:8px 9px;font-weight:750;font-size:13px}.recipes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.recipe{border:1px solid var(--line);border-radius:18px;background:#fff;padding:12px;overflow:hidden;transition:opacity .15s}.recipe.over{opacity:.38}.recipe-top{display:flex;gap:9px;align-items:center}.dish{width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:#fff7e8;overflow:hidden;flex:none}.dish img{width:100%;height:100%;object-fit:contain}.recipe h3{font-size:15px;margin:0;line-height:1.15}.category{font-size:10px;color:var(--gold);font-weight:900;margin-top:4px;text-transform:uppercase}.ing-total{font-size:18px;font-weight:950;margin:10px 0 4px}.power{font-size:13px;color:var(--muted)}.power b{color:var(--ink)}.ings{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.ing{display:flex;gap:4px;align-items:center;font-size:13px;background:#f3f5f9;border-radius:999px;padding:4px 7px;font-weight:800;white-space:nowrap}.ing img{width:19px;height:19px;object-fit:contain}.select{width:100%;margin-top:2px}
    .inventory-row{display:grid;grid-template-columns:28px 1fr 84px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f2f7}.inventory-row input{width:100%;border:1px solid #ccd4e4;border-radius:9px;padding:7px}.hint{font-size:12px;color:var(--muted);line-height:1.45}.empty{color:var(--muted);font-size:14px;padding:10px 0}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}
    .backdrop{position:fixed;inset:0;background:#10182a70;z-index:20;display:none}.backdrop.show{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);background:#fff;z-index:21;transform:translateX(105%);transition:transform .22s ease;overflow:auto;padding:18px;box-shadow:-8px 0 25px #10182a22}.drawer.show{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawer-head h2{margin:0}.close{background:none;font-size:31px;color:#718096}.divider{height:1px;background:var(--line);margin:16px 0}.stepper{display:grid;grid-template-columns:52px 1fr 52px;border:1px solid #bfc8d8;border-radius:11px;overflow:hidden}.stepper button{background:#f8f9fc;font-size:24px;color:#657086}.stepper input{border:0;border-left:1px solid #d8ddea;border-right:1px solid #d8ddea;text-align:center;padding:9px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.check{display:flex;align-items:center;gap:7px;border:1px solid #edf0f5;border-radius:10px;padding:7px;font-size:13px}.check img{width:22px;height:22px;object-fit:contain}
    .modal-back{position:fixed;inset:0;background:#10182a73;z-index:30;display:none;align-items:flex-end;justify-content:center}.modal-back.show{display:flex}.modal{width:min(680px,100%);max-height:91vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.modal h2{font-size:19px;margin:0 0 10px}.base{display:flex;align-items:center;gap:7px;background:#f5f7fb;padding:10px;border-radius:10px;margin:6px 0}.base img{width:24px;height:24px;object-fit:contain}.filler{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;padding:6px 0}.filler input{width:100%;border:1px solid #ccd4e4;border-radius:9px;padding:7px}.review{display:grid;grid-template-columns:28px 1fr 85px;gap:8px;align-items:center;border-bottom:1px solid #eef0f5;padding:8px 0}.review input{border:1px solid #ccd4e4;border-radius:9px;padding:7px;width:100%}
    .plan-summary{margin:18px 0 14px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#f9fbff}.plan-summary-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px}.plan-summary-head h3{margin:0;font-size:16px}.plan-summary-head span{font-size:11px;color:var(--muted)}.balance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.balance{display:grid;grid-template-columns:27px minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px;border-radius:10px;background:#fff}.balance img{width:25px;height:25px;object-fit:contain}.balance-main{min-width:0}.balance-top{display:flex;align-items:baseline;justify-content:space-between;gap:5px;font-size:12px;font-weight:900}.balance-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.balance-progress{height:6px;background:#e2e7ef;border-radius:999px;overflow:hidden;margin-top:4px}.balance-progress i{display:block;height:100%;border-radius:inherit;background:var(--success)}.balance.short .balance-progress i{background:#ef4650}.balance-amount{font-size:13px;font-weight:950;white-space:nowrap;color:var(--success)}.balance.short .balance-amount{color:var(--danger)}.balance-note{font-size:10px;color:var(--muted);font-weight:700}.summary-totals{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.summary-total{text-align:center;background:#fff;border-radius:11px;padding:9px}.summary-total b{display:block;font-size:22px}.summary-total span{display:block;font-size:11px;color:var(--muted)}.summary-total.missing b{color:var(--danger)}.filler-safe{font-size:12px;color:var(--success);font-weight:800;margin:-1px 0 8px}
    .loading{padding:30px;text-align:center;color:var(--muted)}.error{margin:20px auto;max-width:700px;background:#fff0f1;border:1px solid #ffd2d5;border-radius:14px;padding:16px;color:#8f2830}.error code{display:block;background:#fff;padding:8px;border-radius:7px;margin-top:8px;color:#4b5565;overflow:auto}
    @media(max-width:620px){.app{padding:0 10px 32px}header{margin:0 -10px 14px;padding:10px 10px 0}.top{min-height:48px}.app-logo{height:39px;max-width:112px}.brand{gap:9px}.brand-copy h1{font-size:17px}.brand-copy p{display:none}.gear{width:38px;height:38px}.tabs button{padding:9px 12px 11px}.controls{grid-template-columns:1fr 1fr}.controls .field:last-child{grid-column:span 2}.meal-grid{grid-template-columns:1fr}.recipes{gap:8px}.recipe{padding:10px}.dish{width:43px;height:43px}.recipe h3{font-size:13px}.ing-total{font-size:16px}.ing{font-size:12px;padding:3px 6px}.stat{padding:8px}.stat b{font-size:18px}.balance-grid{grid-template-columns:1fr}.balance{padding:8px}.modal{padding:15px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="brand">
        <img class="app-logo" src="./assets/images/logo.png" alt="Pokémon Sleep" onerror="this.style.display='none'">
        <div class="brand-copy"><h1>Cooking Planner</h1><p>Private meal and ingredient planner</p></div>
      </div>
      <button id="gear" class="gear" aria-label="Open settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V20.3h-3v-.09A1.7 1.7 0 0 0 10.68 18.66a1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7.02 15a1.7 1.7 0 0 0-1.55-1.03H5.4v-3h.07A1.7 1.7 0 0 0 7.02 9.94a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.55V4.7h3v.03a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 8l-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1.03h.07v3h-.07A1.7 1.7 0 0 0 19.4 15Z"></path></svg></button>
    </div>
    <nav class="tabs"><button data-tab="today">Today</button><button data-tab="plan">Plan</button><button data-tab="recipes">Recipes</button><button data-tab="ingredients">Ingredients</button></nav>
  </header>
  <main id="content"><div class="loading">Loading recipes and ingredient images…</div></main>
</div>
<div id="backdrop" class="backdrop"></div><aside id="drawer" class="drawer"></aside><div id="modalBack" class="modal-back"><div id="modal" class="modal"></div></div>
<script>
const LEVEL_BONUS={1:0,2:2,3:4,4:6,5:8,6:9,7:11,8:13,9:16,10:18,11:19,12:21,13:23,14:24,15:26,16:28,17:30,18:31,19:33,20:35,21:37,22:40,23:42,24:45,25:47,26:50,27:52,28:55,29:58,30:61,31:64,32:67,33:70,34:74,35:77,36:81,37:84,38:88,39:92,40:96,41:100,42:104,43:108,44:113,45:117,46:122,47:127,48:132,49:137,50:142,51:148,52:153,53:159,54:165,55:171,56:177,57:183,58:190,59:197,60:203,61:209,62:215,63:221,64:227,65:234};
let ingredients=[],recipes=[],I={};
const defaultState={tab:'today',pot:32,category:'Curry / Stew',showOver:true,enabled:{},inventory:{},levels:{},plans:{},selectedSlot:null};
let state=JSON.parse(localStorage.getItem('cookingPlannerV1')||'null')||structuredClone(defaultState);state.enabled||={};state.inventory||={};state.levels||={};state.plans||={};
function slug(value=''){return String(value).toLowerCase().replace(/[“”"']/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function categoryName(title){if(title==='Salads')return 'Salad';if(title==='Desserts')return 'Dessert / Drink';return 'Curry / Stew'}
function save(){localStorage.setItem('cookingPlannerV1',JSON.stringify(state))}
function total(r){return Object.values(r.ings).reduce((a,b)=>a+b,0)}
function recipe(id){return recipes.find(r=>r.id===id)}
function powered(r){if(!r.base)return null;const lv=state.levels[r.id];return lv?Math.round(r.base*(1+(LEVEL_BONUS[lv]||0)/100)):r.base}
function allowed(r){return Object.keys(r.ings).every(id=>state.enabled[id])}
function imageFallback(el){el.style.display='none';const p=el.parentElement;if(p&&!p.textContent.trim())p.textContent='🍽️'}
function ingredientIcon(id,className='icon'){const x=I[id];return x?`<img class="${className}" src="${x.image}" alt="${x.name}" title="${x.name}" onerror="imageFallback(this)">`:`<span title="${id}">❔</span>`}
function iconList(ings){return Object.entries(ings).map(([id,q])=>`<span class="ing" title="${I[id]?.name||id}">${ingredientIcon(id)} ${q}</span>`).join('')}
function day(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}
function dk(d){return d.toISOString().slice(0,10)}
function label(n){return n===0?'Today':n===1?'Tomorrow':day(n).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function slots(range=7){const out=[];for(let d=0;d<range;d++)for(const meal of ['Breakfast','Lunch','Dinner'])out.push({day:d,meal,label:label(d),key:dk(day(d))+'-'+meal});return out}
function needs(range=7){const n={};slots(range).forEach(s=>{const p=state.plans[s.key],r=p&&recipe(p.recipe);if(p&&!p.cooked&&r)Object.entries(r.ings).forEach(([id,q])=>n[id]=(n[id]||0)+q)});return n}
function shortageTimeline(){const bal={...state.inventory},out=[];slots(7).forEach(s=>{const p=state.plans[s.key],r=p&&recipe(p.recipe);if(!p||p.cooked||!r)return;Object.entries(r.ings).forEach(([id,q])=>{bal[id]=(bal[id]||0)-q;if(bal[id]<0&&!out.some(x=>x.id===id))out.push({id,short:-bal[id],slot:s})})});return out}
function setTab(t){state.tab=t;save();render()}
function recipeCard(r,selectable=true){const over=total(r)>state.pot;const value=powered(r);const strength=value===null?'Recipe Strength: —':`Recipe Strength: ${value.toLocaleString()}`;return `<article class="recipe ${over?'over':''}"><div class="recipe-top"><div class="dish"><img src="${r.image}" alt="${r.name}" onerror="imageFallback(this)"></div><div><h3>${r.name}</h3><div class="category">${r.cat}</div></div></div><div class="ing-total">${total(r)} INGREDIENTS</div><div class="power">Lv. ${state.levels[r.id]||'—'} · <b>${strength}</b></div><div class="ings">${iconList(r.ings)}</div>${selectable?`<button class="primary select" data-pick="${r.id}">Select recipe</button>`:''}</article>`}
function mealCard(s){const p=state.plans[s.key],r=p&&recipe(p.recipe);if(!r)return `<div class="meal"><h3>${s.meal}</h3><div class="meal-name">No recipe selected</div><div class="status">Choose a recipe</div><button class="primary" data-select="${s.key}">Select recipe</button></div>`;return `<div class="meal"><h3>${s.meal}</h3><div class="planned-recipe"><img class="planned-dish-image" src="${r.image}" alt="${r.name}" onerror="imageFallback(this)"><div class="meal-name">${r.name}</div><div class="ings meal-ingredients">${iconList(r.ings)}</div></div><div class="status">${p.cooked?'Cooked':'Planned'} · ${total(r)} ingredients</div><div class="row">${p.cooked?'<button class="secondary" disabled>Cooked</button>':`<button class="primary" data-cook="${s.key}">Mark cooked</button>`}<button class="secondary" data-select="${s.key}">Change</button></div></div>`}
function today(){const n=needs(1),missing=Object.entries(n).reduce((a,[id,q])=>a+Math.max(0,q-(state.inventory[id]||0)),0),short=shortageTimeline().slice(0,4);return `<div class="panel"><h2 class="title">Today <small>${day(0).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</small></h2><div class="controls"><div class="field"><label>Weekly category</label><select id="cat"><option>Curry / Stew</option><option>Salad</option><option>Dessert / Drink</option></select></div><div class="field"><label>Normal pot capacity</label><input id="pot" type="number" min="1" max="200" value="${state.pot}"></div><div class="field"><label>Recipe catalog</label><input value="Accessible recipes" disabled></div></div></div><div class="stats"><div class="stat"><b>${Object.values(n).reduce((a,b)=>a+b,0)}</b><span>Ingredients needed today</span></div><div class="stat"><b>${missing}</b><span>Missing for remaining meals</span></div><div class="stat"><b>${slots(7).filter(s=>state.plans[s.key]&&!state.plans[s.key].cooked).length}</b><span>Upcoming planned meals</span></div></div><div class="panel"><h2 class="title">Remaining meals <small>All choices stay editable until cooked</small></h2><div class="meal-grid">${slots(1).map(mealCard).join('')}</div></div><div class="panel"><h2 class="title">Plan ahead <small>First shortages in your next 7 days</small></h2>${short.length?`<div class="priority-list">${short.map(x=>`<div class="priority">${ingredientIcon(x.id,'timeline-icon')}<div><div class="name">${I[x.id]?.name||x.id}</div><div class="sub">Need ${x.short} more by ${x.slot.label} ${x.slot.meal}</div></div><span class="badge ${x.slot.day<2?'urgent':''}">${x.slot.day===0?'Today':x.slot.day===1?'Tomorrow':'Later'}</span></div>`).join('')}</div>`:'<div class="empty">Your current planned base recipes are covered.</div>'}<div class="row" style="margin-top:12px"><button class="secondary" data-go="ingredients">Full ingredient timeline</button></div></div>`}
function plan(){return slots(7).reduce((html,s,i)=>{if(i%3===0)html+=`<div class="panel"><h2 class="title">${s.label}<small>${day(s.day).toLocaleDateString(undefined,{weekday:'long'})}</small></h2><div class="meal-grid">`;html+=mealCard(s);if(i%3===2)html+='</div></div>';return html},'')}
function recipeView(){return `<div class="panel"><h2 class="title">Recipes <small>${state.category}</small></h2><div class="toolbar"><input id="search" placeholder="Search recipes…"><label class="toggle"><input id="makeable" type="checkbox"> What can I make?</label><select id="sort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select><button class="secondary" id="master">Master list</button></div><div id="recipeGrid" class="recipes"></div></div>`}
function drawRecipes({master=false,target='recipeGrid',picker=false}={}){const root=document.getElementById(target);if(!root)return;const q=(document.getElementById(picker?'pickerSearch':'search')?.value||'').toLowerCase(),makeable=document.getElementById(picker?'pickerMakeable':'makeable')?.checked,sort=document.getElementById(picker?'pickerSort':'sort')?.value||'power';let list=recipes.filter(r=>(master||(allowed(r)&&r.cat===state.category))&&r.name.toLowerCase().includes(q));if(!master&&!state.showOver)list=list.filter(r=>total(r)<=state.pot);if(makeable)list=list.filter(r=>total(r)<=state.pot&&Object.entries(r.ings).every(([id,n])=>(state.inventory[id]||0)>=n));list.sort((a,b)=>sort==='power'?((powered(b)||0)-(powered(a)||0)):sort==='ingredients'?total(b)-total(a):a.name.localeCompare(b.name));root.innerHTML=list.length?list.map(r=>recipeCard(r,!master)).join(''):'<div class="empty">No recipes match these filters.</div>';root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>chooseRecipe(b.dataset.pick))}
function ingredientView(){const n=needs(7),rows=ingredients.filter(x=>state.enabled[x.id]||state.inventory[x.id]||n[x.id]).sort((a,b)=>a.name.localeCompare(b.name));return `<div class="panel"><h2 class="title">Ingredients <small>Inventory and 7-day requirements</small></h2><p class="hint">Enter the ingredients you currently have. Your plan totals include selected, uncooked meals.</p><div class="inventory-list">${rows.length?rows.map(x=>{const have=Math.max(0,Number(state.inventory[x.id])||0),need=n[x.id]||0,delta=have-need;return `<div class="inventory-row">${ingredientIcon(x.id)}<div><div class="name">${x.name}</div><div class="sub">Need ${need} · ${delta<0?`Short ${Math.abs(delta)}`:`Extra ${delta}`}</div></div><input type="number" min="0" value="${have}" data-inventory="${x.id}" aria-label="${x.name} inventory"></div>`}).join(''):'<div class="empty">Enable ingredients in Settings to begin tracking inventory.</div>'}</div></div>`}
function planBalance(){const required=needs(7);const ids=[...new Set([...Object.keys(state.inventory),...Object.keys(required)])].filter(id=>(Number(state.inventory[id])||0)>0||(required[id]||0)>0);return ids.map(id=>{const have=Math.max(0,Number(state.inventory[id])||0),need=required[id]||0;return {id,have,need,delta:have-need,pct:need?Math.min(100,Math.round(have/need*100)):100}}).sort((a,b)=>a.delta-b.delta||((I[a.id]?.name||a.id).localeCompare(I[b.id]?.name||b.id)))}
function inlinePlanSummary(){const rows=planBalance();const missing=rows.reduce((sum,x)=>sum+Math.max(0,-x.delta),0);const required=rows.reduce((sum,x)=>sum+x.need,0);if(!rows.length)return `<section class="plan-summary"><div class="plan-summary-head"><h3>Ingredient summary</h3><span>Select recipes to see your balance</span></div><div class="empty">No ingredients are reserved by the current plan yet.</div></section>`;return `<section class="plan-summary"><div class="plan-summary-head"><h3>Ingredient summary</h3><span>Reserved for remaining planned meals</span></div><div class="balance-grid">${rows.map(x=>`<div class="balance ${x.delta<0?'short':''}">${ingredientIcon(x.id,'timeline-icon')}<div class="balance-main"><div class="balance-top"><span class="balance-name">${I[x.id]?.name||x.id}</span><span>${x.have} · ${x.pct}%</span></div><div class="balance-progress"><i style="width:${x.pct}%"></i></div><div class="balance-note">Need ${x.need}</div></div><span class="balance-amount">${x.delta<0?`-${Math.abs(x.delta)}`:`+${x.delta}`}</span></div>`).join('')}</div><div class="summary-totals"><div class="summary-total missing"><b>${missing}</b><span>Missing</span></div><div class="summary-total"><b>${required}</b><span>Required</span></div></div></section>`}
function reviewModal(recipeId){const r=recipe(recipeId);if(!r)return;const fillerIds=ingredients.filter(x=>state.enabled[x.id]&&!r.ings[x.id]).map(x=>x.id);const fillerRows=fillerIds.map(id=>`<div class="filler">${ingredientIcon(id)}<label>${I[id]?.name||id}</label><input type="number" min="0" value="0" data-filler="${id}"></div>`).join('');openModal(`<h2>Review cooking plan</h2><div class="base"><img src="${r.image}" alt=""><strong>${r.name}</strong><span class="sub">${total(r)} base ingredients</span></div><div class="review-list">${Object.entries(r.ings).map(([id,q])=>`<div class="review">${ingredientIcon(id)}<div><div class="name">${I[id]?.name||id}</div><div class="sub">Recipe needs ${q}</div></div><input type="number" min="0" value="${q}" data-review="${id}"></div>`).join('')}</div>${inlinePlanSummary()}<div class="divider"></div><h3 style="margin:0 0 4px">Filler ingredients</h3><div class="filler-safe">Green + amounts above are available after reserving your planned meals.</div><p class="hint">Optional extras for this cook. They are not counted in the plan summary until the meal is marked cooked.</p><div id="fillerRows">${fillerRows||'<div class="empty">No other enabled ingredients available as fillers.</div>'}</div><div class="footer"><button class="secondary" data-modal-close>Cancel</button><button class="primary" id="confirmCook">Confirm meal</button></div>`);document.getElementById('confirmCook').onclick=()=>{const base={};document.querySelectorAll('[data-review]').forEach(i=>base[i.dataset.review]=Math.max(0,Number(i.value)||0));const filler={};document.querySelectorAll('[data-filler]').forEach(i=>{const q=Math.max(0,Number(i.value)||0);if(q)filler[i.dataset.filler]=q});closeModal();confirmRecipe(state.selectedSlot,recipeId,base,filler)}}
function chooseRecipe(id){if(!state.selectedSlot)return;reviewModal(id)}
function confirmRecipe(slotKey,recipeId,base,filler){state.plans[slotKey]={recipe:recipeId,cooked:false,base,filler};state.selectedSlot=null;save();render()}
function cook(slotKey){const p=state.plans[slotKey],r=p&&recipe(p.recipe);if(!p||!r)return;const used={...(p.base||r.ings),...(p.filler||{})};Object.entries(used).forEach(([id,q])=>state.inventory[id]=Math.max(0,(Number(state.inventory[id])||0)-q));p.cooked=true;save();render()}
function selectSlot(key){state.selectedSlot=key;openModal(`<h2>Select a recipe</h2><div class="toolbar"><input id="pickerSearch" placeholder="Search recipes…"><label class="toggle"><input id="pickerMakeable" type="checkbox"> What can I make?</label><select id="pickerSort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select></div><div id="pickerGrid" class="recipes"></div><div class="footer"><button class="secondary" data-modal-close>Cancel</button></div>`);drawRecipes({target:'pickerGrid',picker:true});['pickerSearch','pickerMakeable','pickerSort'].forEach(id=>document.getElementById(id).oninput=()=>drawRecipes({target:'pickerGrid',picker:true}));document.getElementById('pickerMakeable').onchange=()=>drawRecipes({target:'pickerGrid',picker:true})}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBack').classList.add('show');document.querySelectorAll('[data-modal-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){document.getElementById('modalBack').classList.remove('show');document.getElementById('modal').innerHTML='';state.selectedSlot=null}
function settings(){const enabled=ingredients.map(x=>`<label class="check"><input type="checkbox" data-enabled="${x.id}" ${state.enabled[x.id]?'checked':''}>${ingredientIcon(x.id)}<span>${x.name}</span></label>`).join('');document.getElementById('drawer').innerHTML=`<div class="drawer-head"><h2>Settings</h2><button class="close" id="closeDrawer" aria-label="Close">×</button></div><p class="hint">Choose ingredients your helpers can gather. Recipes using disabled ingredients are hidden from the main catalog.</p><div class="checks">${enabled}</div><div class="divider"></div><button class="danger" id="reset">Reset planner data</button>`;document.getElementById('backdrop').classList.add('show');document.getElementById('drawer').classList.add('show');document.getElementById('closeDrawer').onclick=closeDrawer;document.querySelectorAll('[data-enabled]').forEach(x=>x.onchange=()=>{state.enabled[x.dataset.enabled]=x.checked;save();render()});document.getElementById('reset').onclick=()=>{if(confirm('Reset plans, inventory, and saved levels?')){state=structuredClone(defaultState);save();closeDrawer();render()}}}
function closeDrawer(){document.getElementById('backdrop').classList.remove('show');document.getElementById('drawer').classList.remove('show')}
function bindPage(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.tab);b.onclick=()=>setTab(b.dataset.tab)});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>selectSlot(b.dataset.select));document.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>cook(b.dataset.cook));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));document.querySelectorAll('[data-inventory]').forEach(i=>i.onchange=()=>{state.inventory[i.dataset.inventory]=Math.max(0,Number(i.value)||0);save();render()});const cat=document.getElementById('cat'),pot=document.getElementById('pot');if(cat){cat.value=state.category;cat.onchange=()=>{state.category=cat.value;save();render()}}if(pot)pot.onchange=()=>{state.pot=Math.max(1,Number(pot.value)||32);save();render()};const search=document.getElementById('search'),makeable=document.getElementById('makeable'),sort=document.getElementById('sort');if(search){search.oninput=()=>drawRecipes();makeable.onchange=()=>drawRecipes();sort.onchange=()=>drawRecipes();document.getElementById('master').onclick=()=>{openModal(`<h2>Master recipe list</h2><div id="masterGrid" class="recipes"></div><div class="footer"><button class="secondary" data-modal-close>Close</button></div>`);drawRecipes({master:true,target:'masterGrid'});document.querySelector('[data-modal-close]').onclick=closeModal};drawRecipes()}}
function render(){const content=document.getElementById('content');if(!ingredients.length||!recipes.length){content.innerHTML='<div class="loading">Loading recipes and ingredient images…</div>';return}if(state.tab==='today')content.innerHTML=today();else if(state.tab==='plan')content.innerHTML=plan();else if(state.tab==='recipes')content.innerHTML=recipeView();else content.innerHTML=ingredientView();bindPage()}
async function loadData(){try{const [ingRes,recipeRes]=await Promise.all([fetch('./assets/data/ingredients.json'),fetch('./assets/data/recipes.json')]);if(!ingRes.ok||!recipeRes.ok)throw new Error('Could not load ./assets/data/ingredients.json and ./assets/data/recipes.json');ingredients=await ingRes.json();recipes=await recipeRes.json();ingredients=ingredients.map(x=>({...x,id:x.id||slug(x.name)}));recipes=recipes.map(x=>({...x,id:x.id||slug(x.name),ings:x.ings||x.ingredients||{}}));I=Object.fromEntries(ingredients.map(x=>[x.id,x]));if(!Object.keys(state.enabled).length)ingredients.forEach(x=>state.enabled[x.id]=true);save();render()}catch(err){document.getElementById('content').innerHTML=`<div class="error"><strong>Unable to load planner data.</strong><div>Make sure this page is served with the project assets folder.</div><code>${err.message}</code></div>`}}
document.getElementById('gear').onclick=settings;document.getElementById('backdrop').onclick=closeDrawer;document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};loadData();
</script>
</body>
</html>
