<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Cooking Planner</title>
  <style>
    :root{--blue:#2865e8;--blue-soft:#eef4ff;--ink:#16213a;--muted:#69758a;--line:#e5e9f2;--bg:#ffffff;--card:#ffffff;--soft:#f6f8fc;--danger:#bf3942;--gold:#996300}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1120px;margin:auto;padding:0 18px 48px}
    header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);margin:0 -18px 18px;padding:12px 18px 0;box-shadow:0 2px 12px #26334e0a}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:54px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.app-logo{height:48px;width:auto;max-width:145px;object-fit:contain;display:block}.brand-copy h1{font-size:20px;margin:0;letter-spacing:-.2px}.brand-copy p{font-size:12px;margin:2px 0 0;color:var(--muted)}
    .gear{width:42px;height:42px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;background:#fff;color:var(--ink);flex:none;font-size:22px;font-weight:900;line-height:1}.gear:hover{background:var(--soft)}.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{position:relative;color:var(--muted);background:transparent;padding:10px 15px 12px;white-space:nowrap;font-weight:800;border-radius:8px 8px 0 0}.tabs button.active{color:var(--blue)}.tabs button.active:after{content:"";position:absolute;height:3px;background:var(--blue);border-radius:3px 3px 0 0;bottom:0;left:13px;right:13px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #26334e08}.title{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:0 0 11px;font-size:17px}.title small{font-size:12px;color:var(--muted);font-weight:500}.field label{font-size:12px;color:var(--muted);font-weight:800;display:block;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #ccd4e4;border-radius:10px;padding:9px;background:#fff;color:var(--ink)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--soft);border-radius:13px;padding:11px}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted);line-height:1.2;display:block}.inventory-summary{padding:0;overflow:hidden}.inventory-head{width:100%;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;background:#fff;padding:15px 16px}.inventory-head:hover{background:#fafbff}.inventory-head .inv-label{font-size:17px;font-weight:850}.inventory-head .inv-meta{grid-column:1;font-size:12px;color:var(--muted);font-weight:600;margin-top:-2px}.inventory-head .chevron{grid-column:2;grid-row:1 / span 2;color:var(--blue);font-size:13px;font-weight:900}.inventory-body{padding:0 12px 16px;border-top:1px solid var(--line)}.inventory-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .meal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.meal{border:1px solid var(--line);border-radius:14px;padding:12px}.meal h3{font-size:14px;margin:0 0 8px}.meal-name{font-size:15px;font-weight:900;line-height:1.2;margin:0 0 10px}.status{font-size:12px;color:var(--muted);margin:8px 0}.planned-recipe{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:start;margin:6px 0 9px}.planned-dish-image{width:78px;height:78px;object-fit:contain;border-radius:12px;background:#fff7e8;padding:4px}.meal-ingredients{margin:0;align-content:start}
    .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.primary,.secondary,.danger{font-size:13px;border-radius:10px;padding:8px 10px;font-weight:800}.primary{background:var(--blue);color:#fff}.primary:hover{background:#1e56d3}.secondary{background:#f1f4fa;color:var(--ink)}.secondary:hover{background:#e7ebf4}.danger{background:#ffedef;color:var(--danger)}
    .priority-list{display:grid;gap:7px}.inventory-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 20px}.priority{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:9px;border-radius:11px;background:#fafbff}.icon{width:25px;height:25px;object-fit:contain;vertical-align:middle}.timeline-icon{width:25px;height:25px;object-fit:contain}.name{font-weight:800}.sub{font-size:12px;color:var(--muted)}.badge{background:#fff1d9;color:#895700;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.badge.urgent{background:#ffe8ea;color:#a92d35}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.toolbar input{min-width:150px;flex:1;border:1px solid #ccd4e4;border-radius:10px;padding:10px}.toolbar select{border:1px solid #ccd4e4;border-radius:10px;padding:9px;background:#fff}.filter-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:1px solid #ccd4e4;border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px;color:var(--ink)}.filter-button.active{background:var(--blue);border-color:var(--blue);color:#fff}.recipes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.recipe{border:1px solid var(--line);border-radius:18px;background:#fff;padding:12px;overflow:hidden;transition:opacity .15s}.recipe.over{opacity:.38}.recipe-top{display:flex;gap:9px;align-items:center}.dish{width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:#fff7e8;overflow:hidden;flex:none}.dish img{width:100%;height:100%;object-fit:contain}.recipe h3{font-size:15px;margin:0;line-height:1.15}.category{font-size:10px;color:var(--gold);font-weight:900;margin-top:4px;text-transform:uppercase}.ing-total{font-size:18px;font-weight:950;margin:10px 0 4px}.power{font-size:13px;color:var(--muted)}.power b{color:var(--ink)}.ings{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.ing{display:flex;gap:4px;align-items:center;font-size:13px;background:#f3f5f9;border-radius:999px;padding:4px 7px;font-weight:800;white-space:nowrap}.ing img{width:19px;height:19px;object-fit:contain}.select{width:100%;margin-top:2px}
    .inventory-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(150px,188px);gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f2f7}.inventory-row label{font-weight:700}.hint{font-size:12px;color:var(--muted);line-height:1.45}.empty{color:var(--muted);font-size:14px;padding:10px 0}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}
    .backdrop{position:fixed;inset:0;background:#10182a70;z-index:20;display:none}.backdrop.show{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);background:#fff;z-index:21;transform:translateX(105%);transition:transform .22s ease;overflow:auto;padding:18px;box-shadow:-8px 0 25px #10182a22}.drawer.show{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawer-head h2{margin:0}.close{background:none;font-size:31px;color:#718096}.divider{height:1px;background:var(--line);margin:16px 0}.stepper{display:grid;grid-template-columns:44px 1fr 44px;border:1px solid #bfc8d8;border-radius:11px;overflow:hidden;min-height:42px}.stepper button{background:#f8f9fc;font-size:23px;color:#657086;font-weight:800}.stepper button:hover{background:#edf1f8}.stepper input{border:0;border-left:1px solid #d8ddea;border-right:1px solid #d8ddea;text-align:center;padding:8px;min-width:0}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.check{display:flex;align-items:center;gap:7px;border:1px solid #edf0f5;border-radius:10px;padding:7px;font-size:13px}.check img{width:22px;height:22px;object-fit:contain}
    .modal-back{position:fixed;inset:0;background:#10182a73;z-index:30;display:none;align-items:flex-end;justify-content:center}.modal-back.show{display:flex}.modal{width:min(640px,100%);max-height:91vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.modal h2{font-size:19px;margin:0 0 10px}.base{display:flex;align-items:center;gap:7px;background:#f5f7fb;padding:10px;border-radius:10px;margin:6px 0}.base img{width:24px;height:24px;object-fit:contain}.filler{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:6px 0}.review{display:grid;grid-template-columns:28px 1fr 150px;gap:8px;align-items:center;border-bottom:1px solid #eef0f5;padding:8px 0}.cooked-level{display:grid;grid-template-columns:minmax(120px,1fr) 118px;gap:12px;align-items:center;background:#f5f7fb;border-radius:12px;padding:11px;margin:8px 0 14px}.cooked-level .stepper{grid-template-columns:32px minmax(38px,1fr) 32px;min-height:34px}.cooked-level .stepper button{font-size:18px}.cooked-level .stepper input{padding:6px 2px;font-size:14px;font-weight:800}.cooked-level label{font-weight:850}.slot-list{display:grid;gap:6px;max-height:52vh;overflow:auto}.slot-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:12px}.loading{padding:30px;text-align:center;color:var(--muted)}.error{margin:20px auto;max-width:700px;background:#fff0f1;border:1px solid #ffd2d5;border-radius:14px;padding:16px;color:#8f2830}.error code{display:block;background:#fff;padding:8px;border-radius:7px;margin-top:8px;color:#4b5565;overflow:auto}
    @media(max-width:620px){.app{padding:0 10px 32px}header{margin:0 -10px 14px;padding:10px 10px 0}.top{min-height:48px}.app-logo{height:39px;max-width:112px}.brand{gap:9px}.brand-copy h1{font-size:17px}.brand-copy p{display:none}.gear{width:38px;height:38px}.tabs button{padding:9px 12px 11px}.meal-grid{grid-template-columns:1fr}.recipes{gap:8px}.recipe{padding:10px}.dish{width:43px;height:43px}.recipe h3{font-size:13px}.ing-total{font-size:16px}.ing{font-size:12px;padding:3px 6px}.stat{padding:8px}.stat b{font-size:18px}.inventory-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 3px}.inventory-row{grid-template-columns:32px minmax(0,1fr) 72px;gap:3px;padding:6px 0}.inventory-row label{font-size:10px;line-height:1.15;overflow-wrap:normal;word-break:keep-all;hyphens:none}.inventory-row .icon{width:32px;height:32px}.inventory-row .stepper{grid-template-columns:18px minmax(34px,1fr) 18px;min-height:27px;border-radius:8px}.inventory-row .stepper button{font-size:16px;line-height:1}.inventory-row .stepper input{padding:4px 1px;font-size:13px;font-weight:800;letter-spacing:-.2px}.filler,.review{grid-template-columns:1fr}.filler .stepper,.review .stepper{grid-column:1 / -1}.planned-recipe{grid-template-columns:72px minmax(0,1fr)}.planned-dish-image{width:72px;height:72px}.cooked-level{grid-template-columns:minmax(0,1fr) 112px}.cooked-level .stepper{max-width:112px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="brand">
        <img class="app-logo" src="./assets/images/logo.png" alt="Pokémon Sleep" onerror="this.style.display='none'">
        <div class="brand-copy"><h1>Cooking Planner</h1><p>Private meal and ingredient planner</p></div>
      </div>
      <button id="gear" class="gear" aria-label="Open settings" title="Settings">☰</button>
    </div>
    <nav class="tabs"><button data-tab="today">Today</button><button data-tab="plan">Plan</button><button data-tab="recipes">Recipes</button></nav>
  </header>
  <main id="content"><div class="loading">Loading recipes and ingredient images…</div></main>
</div>
<div id="backdrop" class="backdrop"></div><aside id="drawer" class="drawer"></aside><div id="modalBack" class="modal-back"><div id="modal" class="modal"></div></div>
<script>
const LEVEL_BONUS={1:0,2:2,3:4,4:6,5:8,6:9,7:11,8:13,9:16,10:18,11:19,12:21,13:23,14:24,15:26,16:28,17:30,18:31,19:33,20:35,21:37,22:40,23:42,24:45,25:47,26:50,27:52,28:55,29:58,30:61,31:64,32:67,33:70,34:74,35:77,36:81,37:84,38:88,39:92,40:96,41:100,42:104,43:108,44:113,45:117,46:122,47:127,48:132,49:137,50:142,51:148,52:153,53:159,54:165,55:171,56:177,57:183,58:190,59:197,60:203,61:209,62:215,63:221,64:227,65:234};
let ingredients=[],recipes=[],I={};
const defaultState={tab:'today',pot:32,category:'Curry / Stew',showOver:true,enabled:{},inventory:{},levels:{},plans:{},selectedSlot:null,inventoryOpen:{today:false,plan:false},makeable:false,pickerMakeable:false};
const store={get(){try{return localStorage.getItem('cookingPlannerV1')}catch(e){return null}},set(v){try{localStorage.setItem('cookingPlannerV1',v)}catch(e){}}};
let state=(()=>{try{return JSON.parse(store.get()||'null')||structuredClone(defaultState)}catch(e){return structuredClone(defaultState)}})();state.enabled||={};state.inventory||={};state.levels||={};state.plans||={};state.inventoryOpen||={today:false,plan:false};
function slug(value=''){return String(value).toLowerCase().replace(/[“”"']/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function categoryName(title){if(title==='Salads')return 'Salad';if(title==='Desserts')return 'Dessert / Drink';return 'Curry / Stew'}
function save(){store.set(JSON.stringify(state))}function total(r){return Object.values(r.ings).reduce((a,b)=>a+b,0)}function recipe(id){return recipes.find(r=>r.id===id)}function recipeLevel(r){return Math.max(1,Math.min(65,Number(state.levels[r.id])||0))}function levelText(r){return state.levels[r.id]?`Lv. ${recipeLevel(r)}`:'Level not set'}function powered(r){if(!r.base)return null;const lv=state.levels[r.id];return lv?Math.round(r.base*(1+(LEVEL_BONUS[lv]||0)/100)):r.base}function allowed(r){return Object.keys(r.ings).every(id=>state.enabled[id])}
function imageFallback(el){el.style.display='none';const p=el.parentElement;if(p&&!p.textContent.trim())p.textContent='🍽️'}function ingredientIcon(id,className='icon'){const x=I[id];return x?`<img class="${className}" src="${x.image}" alt="${x.name}" title="${x.name}" onerror="imageFallback(this)">`:`<span title="${id}">❔</span>`}function iconList(ings){return Object.entries(ings).map(([id,q])=>`<span class="ing" title="${I[id]?.name||id}">${ingredientIcon(id)} ${q}</span>`).join('')}
function day(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}function dk(d){return d.toISOString().slice(0,10)}function label(n){return n===0?'Today':n===1?'Tomorrow':day(n).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}function slots(range=7){const out=[];for(let d=0;d<range;d++)for(const meal of ['Breakfast','Lunch','Dinner'])out.push({day:d,meal,label:label(d),key:dk(day(d))+'-'+meal});return out}
function needs(range=7){const n={};slots(range).forEach(s=>{const p=state.plans[s.key],r=p&&recipe(p.recipe);if(p&&!p.cooked&&r)Object.entries(r.ings).forEach(([id,q])=>n[id]=(n[id]||0)+q)});return n}function shortageTimeline(){const bal={...state.inventory},out=[];slots(7).forEach(s=>{const p=state.plans[s.key],r=p&&recipe(p.recipe);if(!p||p.cooked||!r)return;Object.entries(r.ings).forEach(([id,q])=>{bal[id]=(bal[id]||0)-q;if(bal[id]<0&&!out.some(x=>x.id===id))out.push({id,short:-bal[id],slot:s})})});return out}
function clearWeek(scope){const keys=scope==='today'?slots(1).map(x=>x.key):slots(7).map(x=>x.key);const used=keys.filter(k=>state.plans[k]).length;if(!used){alert(scope==='today'?'There are no meals planned for today yet.':'There are no meals planned this week yet.');return}if(!confirm(scope==='today'?`Clear all ${used} of today\u2019s meal slots? Your inventory, recipe levels, and settings are kept.`:`Clear all ${used} planned meals in the next seven days? Your inventory, recipe levels, and settings are kept.`))return;keys.forEach(k=>{delete state.plans[k]});save();render()}
function setTab(t){state.tab=t;save();render()}function setInventory(id,value){state.inventory[id]=Math.max(0,Number(value)||0);save();render()}
function stepper(id,value,kind='inv',min=0,max=''){return `<div class="stepper"><button type="button" data-step="-1" data-${kind}="${id}" aria-label="Decrease ${I[id]?.name||id}">−</button><input data-${kind}-input="${id}" type="number" min="${min}" ${max!==''?`max="${max}"`:''} value="${Math.max(min,value||0)}" aria-label="${I[id]?.name||id} quantity"><button type="button" data-step="1" data-${kind}="${id}" aria-label="Increase ${I[id]?.name||id}">+</button></div>`}
function inventoryPanel(view){const n=needs(view==='today'?1:7),inventoryTotal=Object.values(state.inventory).reduce((a,b)=>a+(+b||0),0),needed=Object.values(n).reduce((a,b)=>a+b,0),open=!!state.inventoryOpen[view];return `<section class="panel inventory-summary"><button class="inventory-head" data-toggle-inventory="${view}" aria-expanded="${open}"><span class="inv-label">Ingredients</span><span class="inv-meta">${inventoryTotal} in inventory · ${needed} needed for ${view==='today'?'today':'planned meals'}</span><span class="chevron">${open?'Hide ▴':'Show ▾'}</span></button>${open?`<div class="inventory-body"><div class="inventory-list">${ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="inventory-row">${ingredientIcon(x.id)}<label>${x.name}</label>${stepper(x.id,state.inventory[x.id]||0)}</div>`).join('')}</div><div class="inventory-actions"><button class="primary" data-upload>Upload bag screenshots</button></div><p class="hint">Tap − or + for quick changes, or type an exact amount. Updates save immediately.</p></div>`:''}</section>`}
function timelinePanel(){const short=shortageTimeline();return `<section class="panel"><h2 class="title">Ingredient timeline <small>First shortages in your next 7 days</small></h2>${short.length?`<div class="priority-list">${short.map(x=>`<div class="priority">${ingredientIcon(x.id,'timeline-icon')}<div><div class="name">${I[x.id]?.name||x.id}</div><div class="sub">Need ${x.short} more by ${x.slot.label} ${x.slot.meal}</div></div><span class="badge ${x.slot.day<2?'urgent':''}">${x.slot.day===0?'Today':x.slot.day===1?'Tomorrow':'Later'}</span></div>`).join('')}</div>`:'<div class="empty">Your current planned base recipes are covered.</div>'}</section>`}
function surplusPanel(){const n=needs(),surplus=ingredients.map(x=>({x,q:Math.max(0,(state.inventory[x.id]||0)-(n[x.id]||0))})).filter(x=>x.q>0);return `<section class="panel"><h2 class="title">Filler surplus <small>Current bag minus unfinished planned base recipes</small></h2>${surplus.length?`<div class="ings">${surplus.map(({x,q})=>`<span class="ing" title="${x.name}">${ingredientIcon(x.id)} ${q}</span>`).join('')}</div>`:'<div class="empty">No filler surplus right now.</div>'}</section>`}
function recipeCard(r,selectable=true){const over=total(r)>state.pot;const value=powered(r);const strength=value===null?'Recipe Strength: —':`Recipe Strength: ${value.toLocaleString()}`;return `<article class="recipe ${over?'over':''}"><div class="recipe-top"><div class="dish"><img src="${r.image}" alt="${r.name}" onerror="imageFallback(this)"></div><div><h3>${r.name}</h3><div class="category">${r.cat}</div></div></div><div class="ing-total">${total(r)} INGREDIENTS</div><div class="power">Lv. ${state.levels[r.id]||'—'} · <b>${strength}</b></div><div class="ings">${iconList(r.ings)}</div>${selectable?`<button class="primary select" data-pick="${r.id}">Add to a meal</button>`:''}</article>`}
function mealCard(s){const p=state.plans[s.key],r=p&&recipe(p.recipe);if(!r)return `<div class="meal"><h3>${s.meal}</h3><div class="meal-name">No recipe selected</div><div class="status">Choose a recipe</div><button class="primary" data-select="${s.key}">Select recipe</button></div>`;return `<div class="meal"><h3>${s.meal}</h3><div class="meal-name">${r.name}</div><div class="planned-recipe"><img class="planned-dish-image" src="${r.image}" alt="${r.name}" onerror="imageFallback(this)"><div class="ings meal-ingredients">${iconList(r.ings)}</div></div><div class="status">${p.cooked?'Cooked':'Planned'} · ${levelText(r)} · ${total(r)} ingredients</div><div class="row">${p.cooked?'<button class="secondary" disabled>Cooked</button>':`<button class="primary" data-cook="${s.key}">Mark cooked</button>`}<button class="secondary" data-select="${s.key}">Change</button></div></div>`}
function today(){const n=needs(1),missing=Object.entries(n).reduce((a,[id,q])=>a+Math.max(0,q-(state.inventory[id]||0)),0);return `<section class="panel"><h2 class="title">Today <small>${day(0).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</small></h2></section>${inventoryPanel('today')}<div class="stats"><div class="stat"><b>${Object.values(n).reduce((a,b)=>a+b,0)}</b><span>Ingredients needed today</span></div><div class="stat"><b>${missing}</b><span>Missing for remaining meals</span></div><div class="stat"><b>${slots(7).filter(s=>state.plans[s.key]&&!state.plans[s.key].cooked).length}</b><span>Upcoming planned meals</span></div></div><section class="panel"><h2 class="title">Remaining meals <small>All choices stay editable until cooked</small></h2><div class="row" style="margin-bottom:10px"><button class="danger" data-clear="today">Reset today\u2019s meals</button></div><div class="meal-grid">${slots(1).map(mealCard).join('')}</div></section>${timelinePanel()}${surplusPanel()}`}
function plan(){let days=slots(7).reduce((html,s,i)=>{if(i%3===0)html+=`<section class="panel"><h2 class="title">${s.label}<small>${day(s.day).toLocaleDateString(undefined,{weekday:'long'})}</small></h2><div class="meal-grid">`;html+=mealCard(s);if(i%3===2)html+='</div></section>';return html},'');return `<section class="panel"><h2 class="title">Plan <small>Plan your next seven days</small></h2><div class="row"><button class="danger" data-clear="week">Reset this week\u2019s plan</button></div></section>${inventoryPanel('plan')}${days}${timelinePanel()}${surplusPanel()}`}
function recipeView(){return `<section class="panel"><h2 class="title">Recipes <small>${state.category}</small></h2><div class="toolbar"><input id="search" placeholder="Search recipes…"><button id="makeable" class="filter-button ${state.makeable?'active':''}" aria-pressed="${state.makeable}">${state.makeable?'✓ ':''}What can I make?</button><select id="sort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select></div><div id="recipeGrid" class="recipes"></div></section>`}
function drawRecipes({master=false,target='recipeGrid',picker=false}={}){const root=document.getElementById(target);if(!root)return;const q=(document.getElementById(picker?'pickerSearch':'search')?.value||'').toLowerCase(),makeable=picker?state.pickerMakeable:state.makeable,sort=document.getElementById(picker?'pickerSort':'sort')?.value||'power';let list=recipes.filter(r=>(master||(allowed(r)&&r.cat===state.category))&&r.name.toLowerCase().includes(q));if(!master&&!state.showOver)list=list.filter(r=>total(r)<=state.pot);if(makeable)list=list.filter(r=>total(r)<=state.pot&&Object.entries(r.ings).every(([id,n])=>(state.inventory[id]||0)>=n));list.sort((a,b)=>sort==='power'?((powered(b)||0)-(powered(a)||0)):sort==='ingredients'?total(b)-total(a):a.name.localeCompare(b.name));root.innerHTML=list.length?list.map(r=>recipeCard(r,!master)).join(''):'<div class="empty">No recipes match these filters.</div>';root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>chooseRecipe(b.dataset.pick))}
function render(){document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.tab);b.onclick=()=>setTab(b.dataset.tab)});const c=document.getElementById('content');c.innerHTML=state.tab==='today'?today():state.tab==='plan'?plan():recipeView();bind()}
function bind(){document.getElementById('gear').onclick=openDrawer;document.querySelectorAll('[data-toggle-inventory]').forEach(b=>b.onclick=()=>{const v=b.dataset.toggleInventory;state.inventoryOpen[v]=!state.inventoryOpen[v];save();render()});document.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>setInventory(b.dataset.inv,(state.inventory[b.dataset.inv]||0)+Number(b.dataset.step)));document.querySelectorAll('[data-inv-input]').forEach(el=>el.onchange=()=>setInventory(el.dataset.invInput,el.value));document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=openUpload);document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>clearWeek(b.dataset.clear));document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>openPicker(b.dataset.select));document.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>openCook(b.dataset.cook));if(state.tab==='recipes'){drawRecipes();document.getElementById('search').oninput=()=>drawRecipes();document.getElementById('sort').onchange=()=>drawRecipes();document.getElementById('makeable').onclick=()=>{state.makeable=!state.makeable;save();render()}}}
function openDrawer(){const enabled=ingredients.filter(x=>state.enabled[x.id]).length;document.getElementById('drawer').innerHTML=`<div class="drawer-head"><h2>Settings</h2><button id="closeDrawer" class="close">×</button></div><div class="field"><label>Weekly category</label><select id="dcat"><option>Curry / Stew</option><option>Salad</option><option>Dessert / Drink</option></select></div><div class="divider"></div><div class="field"><label>Normal cooking pot size</label><div class="stepper"><button id="minus">−</button><input id="dpot" type="number" min="1" max="200" value="${state.pot}"><button id="plus">+</button></div></div><div class="divider"></div><label class="filter-button"><input id="showOver" type="checkbox" ${state.showOver?'checked':''}> Show recipes over normal pot size</label><div class="divider"></div><h3 style="margin:0 0 6px">Available ingredients</h3><p class="hint">${enabled} / ${ingredients.length} enabled. Disabled ingredients hide their recipes from normal browsing, meal selection, and “What can I make?”</p><div class="checks">${ingredients.map(x=>`<label class="check"><input type="checkbox" data-enabled="${x.id}" ${state.enabled[x.id]?'checked':''}> ${ingredientIcon(x.id)} <span>${x.name}</span></label>`).join('')}</div><div class="divider"></div><h3 style="margin:0 0 6px">Weekly reset</h3><p class="hint">Clear planned and cooked meals at the start of a new week. Inventory, recipe levels, and settings are kept.</p><div class="row"><button class="danger" id="drawerClearToday">Reset today</button><button class="danger" id="drawerClearWeek">Reset 7-day plan</button></div><div class="divider"></div><p class="hint">Your personal data is stored only in this browser.</p><div class="row"><button class="secondary" id="export">Export backup</button><label class="secondary">Import backup<input id="import" type="file" accept="application/json" hidden></label><button class="danger" id="reset">Reset</button></div>`;document.getElementById('dcat').value=state.category;document.getElementById('drawer').classList.add('show');document.getElementById('backdrop').classList.add('show');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('backdrop').onclick=closeDrawer;document.getElementById('minus').onclick=()=>{state.pot=Math.max(1,state.pot-1);save();openDrawer();render()};document.getElementById('plus').onclick=()=>{state.pot++;save();openDrawer();render()};document.getElementById('dpot').onchange=e=>{state.pot=Math.max(1,+e.target.value||1);save();render()};document.getElementById('dcat').onchange=e=>{state.category=e.target.value;save();render()};document.getElementById('showOver').onchange=e=>{state.showOver=e.target.checked;save();render()};document.querySelectorAll('[data-enabled]').forEach(el=>el.onchange=()=>{state.enabled[el.dataset.enabled]=el.checked;save();openDrawer();render()});document.getElementById('drawerClearToday').onclick=()=>{closeDrawer();clearWeek('today')};document.getElementById('drawerClearWeek').onclick=()=>{closeDrawer();clearWeek('week')};document.getElementById('export').onclick=exportData;document.getElementById('import').onchange=importData;document.getElementById('reset').onclick=()=>{if(confirm('Reset all local app data?')){state=structuredClone(defaultState);initializeState();save();closeDrawer();render()}}}
function closeDrawer(){document.getElementById('drawer').classList.remove('show');document.getElementById('backdrop').classList.remove('show')}function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBack').classList.add('show');document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}}function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function openPicker(slot){state.selectedSlot=slot;state.pickerMakeable=false;const s=slots(7).find(x=>x.key===slot);openModal(`<h2>Select recipe for ${s.label} ${s.meal}</h2><div class="toolbar"><input id="pickerSearch" placeholder="Search ${state.category} recipes…"><button id="pickerMakeable" class="filter-button" aria-pressed="false">What can I make?</button><select id="pickerSort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select></div><div id="pickerGrid" class="recipes"></div><div class="footer"><button id="cancelPicker" class="secondary">Cancel</button></div>`);drawRecipes({target:'pickerGrid',picker:true});document.getElementById('pickerSearch').oninput=()=>drawRecipes({target:'pickerGrid',picker:true});document.getElementById('pickerSort').onchange=()=>drawRecipes({target:'pickerGrid',picker:true});document.getElementById('pickerMakeable').onclick=()=>{state.pickerMakeable=!state.pickerMakeable;const b=document.getElementById('pickerMakeable');b.classList.toggle('active',state.pickerMakeable);b.setAttribute('aria-pressed',state.pickerMakeable);b.textContent=(state.pickerMakeable?'✓ ':'')+'What can I make?';drawRecipes({target:'pickerGrid',picker:true})};document.getElementById('cancelPicker').onclick=closeModal}
function openSlotChooser(id){const r=recipe(id);const rows=slots(7).map(s=>{const p=state.plans[s.key],cur=p&&recipe(p.recipe);return `<div class=\"slot-row\"><div><div class=\"name\">${s.label} · ${s.meal}</div><div class=\"sub\">${p?(p.cooked?'Cooked: ':'Planned: ')+(cur?cur.name:'—'):'Open'}</div></div><button class=\"${p?'secondary':'primary'}\" data-slot=\"${s.key}\">${p?'Replace':'Add here'}</button></div>`}).join('');openModal(`<h2>Add ${r.name} to a meal</h2><p class=\"hint\">Choose which meal slot in the next seven days should use this recipe.</p><div class=\"slot-list\">${rows}</div><div class=\"footer\"><button id=\"cancelSlot\" class=\"secondary\">Cancel</button></div>`);document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{state.plans[b.dataset.slot]={recipe:id,cooked:false};save();closeModal();render()});document.getElementById('cancelSlot').onclick=closeModal}
function chooseRecipe(id){if(!state.selectedSlot){openSlotChooser(id);return}state.plans[state.selectedSlot]={recipe:id,cooked:false};save();closeModal();render()}
function bindModalStepper(kind,min=0,max=Infinity){document.querySelectorAll(`[data-${kind}]`).forEach(b=>b.onclick=()=>{const input=document.querySelector(`[data-${kind}-input="${b.dataset[kind]}"]`);input.value=Math.max(min,Math.min(max,(+input.value||0)+Number(b.dataset.step)))})}
function openCook(slot){const p=state.plans[slot],r=recipe(p.recipe),currentLevel=state.levels[r.id]||1;openModal(`<h2>Mark cooked</h2><p class="hint">Confirm the recipe level, then enter only the fillers you actually used. Filler strength is not calculated.</p><div class="cooked-level"><label>Recipe level<br><span class="hint">Saved for ${r.name}</span></label>${stepper(r.id,currentLevel,'level',1,65)}</div><h3>Base recipe</h3>${Object.entries(r.ings).map(([id,q])=>`<div class="base">${ingredientIcon(id)} ${I[id]?.name||id}: <b>${q}</b></div>`).join('')}<h3>Add fillers used</h3><div class="inventory-list filler-list">${ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="inventory-row">${ingredientIcon(x.id)}<label>${x.name}</label>${stepper(x.id,0,'fill')}</div>`).join('')}</div><div class="footer"><button id="cancelCook" class="secondary">Cancel</button><button id="confirmCook" class="primary">Confirm cooked</button></div>`);bindModalStepper('level',1,65);bindModalStepper('fill',0,Infinity);document.getElementById('cancelCook').onclick=closeModal;document.getElementById('confirmCook').onclick=()=>{const levelInput=document.querySelector(`[data-level-input="${r.id}"]`);state.levels[r.id]=Math.max(1,Math.min(65,+levelInput.value||1));const used={...r.ings};document.querySelectorAll('[data-fill-input]').forEach(el=>{const q=Math.max(0,+el.value||0);if(q)used[el.dataset.fillInput]=(used[el.dataset.fillInput]||0)+q});Object.entries(used).forEach(([id,q])=>state.inventory[id]=Math.max(0,(state.inventory[id]||0)-q));p.cooked=true;save();closeModal();render()}}
function openUpload(){openModal(`<h2>Import bag screenshots</h2><p class="hint">Choose one or more Pokémon Sleep bag screenshots. This version provides the private review and correction workflow; it does not automatically read image counts yet.</p><input id="shots" type="file" accept="image/*" multiple><div id="preview" class="hint" style="margin-top:10px"></div><div id="reviewRows" style="margin-top:10px"></div><div class="footer"><button id="cancelUpload" class="secondary">Cancel</button><button id="applyUpload" class="primary">Apply confirmed counts</button></div>`);document.getElementById('cancelUpload').onclick=closeModal;document.getElementById('shots').onchange=e=>{const files=[...e.target.files];document.getElementById('preview').textContent=files.length?`${files.length} screenshot${files.length>1?'s':''} selected. Confirm the inventory values below.`:'No screenshots selected.';document.getElementById('reviewRows').innerHTML=ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="review">${ingredientIcon(x.id)}<label>${x.name}</label>${stepper(x.id,state.inventory[x.id]||0,'import')}</div>`).join('');bindModalStepper('import',0,Infinity)};document.getElementById('applyUpload').onclick=()=>{document.querySelectorAll('[data-import-input]').forEach(el=>state.inventory[el.dataset.importInput]=Math.max(0,+el.value||0));save();closeModal();render()}}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='cooking-planner-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);initializeState();save();closeDrawer();render();alert('Backup imported.')}catch{alert('That file could not be read as a backup.')}};r.readAsText(f)}
function initializeState(){ingredients.forEach(x=>{if(state.enabled[x.id]===undefined)state.enabled[x.id]=true;if(state.inventory[x.id]===undefined)state.inventory[x.id]=0});state.inventoryOpen||={today:false,plan:false};if(!['Curry / Stew','Salad','Dessert / Drink'].includes(state.category))state.category='Curry / Stew'}
function normalizeData(ingredientData,recipeGroups){ingredients=ingredientData.map(raw=>({id:slug(raw.name),name:raw.name,image:raw.imageSrc||''}));I=Object.fromEntries(ingredients.map(x=>[x.id,x]));recipes=[];recipeGroups.forEach(group=>{const cat=categoryName(group.title);(group.recipes||[]).forEach(raw=>{if(!Array.isArray(raw.ingredients)||!raw.ingredients.length)return;const ings={};raw.ingredients.forEach(item=>{const id=slug(item.name);ings[id]=(ings[id]||0)+(Number(item.quantity)||0)});recipes.push({id:slug(raw.name),name:raw.name,cat,base:Number(raw.baseStrength)||0,ings,image:raw.imageSrc||''})})})}
async function loadData(){try{const [ingResponse,recipeResponse]=await Promise.all([fetch('./data/ingredients.json'),fetch('./data/recipes.json')]);if(!ingResponse.ok)throw new Error(`Could not load ingredients.json (${ingResponse.status})`);if(!recipeResponse.ok)throw new Error(`Could not load recipes.json (${recipeResponse.status})`);const [ingData,recipeData]=await Promise.all([ingResponse.json(),recipeResponse.json()]);normalizeData(ingData,recipeData);if(!ingredients.length)throw new Error('No ingredients were found in ingredients.json.');if(!recipes.length)throw new Error('No recipes were found in recipes.json.');initializeState();save();render()}catch(error){document.getElementById('content').innerHTML=`<div class="error"><b>The planner could not load its recipe data.</b><br>${error.message}<br><code>Expected files: ./data/ingredients.json and ./data/recipes.json</code><p>Send a screenshot of this message if it appears again.</p></div>`;console.error(error)}}
loadData();
</script>
