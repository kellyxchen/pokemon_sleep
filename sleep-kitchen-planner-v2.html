:var(--ink)}.ings{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.ing{font-size:13px;background:#f3f5f9;border-radius:999px;padding:4px 7px;font-weight:800;white-space:nowrap}.select{width:100%;margin-top:2px}.inventory-row{display:grid;grid-template-columns:28px 1fr 84px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f2f7}.inventory-row input{width:100%;border:1px solid #ccd4e4;border-radius:9px;padding:7px}.hint{font-size:12px;color:var(--muted);line-height:1.45}.empty{color:var(--muted);font-size:14px;padding:10px 0}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.backdrop{position:fixed;inset:0;background:#10182a70;z-index:20;display:none}.backdrop.show{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);background:#fff;z-index:21;transform:translateX(105%);transition:transform .22s ease;overflow:auto;padding:18px;box-shadow:-8px 0 25px #10182a22}.drawer.show{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawer-head h2{margin:0}.close{background:none;font-size:31px;color:#718096}.divider{height:1px;background:var(--line);margin:16px 0}.stepper{display:grid;grid-template-columns:52px 1fr 52px;border:1px solid #bfc8d8;border-radius:11px;overflow:hidden}.stepper button{background:#f8f9fc;font-size:24px;color:#657086}.stepper input{border:0;border-left:1px solid #d8ddea;border-right:1px solid #d8ddea;text-align:center;padding:9px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.check{display:flex;align-items:center;gap:7px;border:1px solid #edf0f5;border-radius:10px;padding:7px;font-size:13px}.modal-back{position:fixed;inset:0;background:#10182a73;z-index:30;display:none;align-items:flex-end;justify-content:center}.modal-back.show{display:flex}.modal{width:min(640px,100%);max-height:91vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.modal h2{font-size:19px;margin:0 0 10px}.base{background:#f5f7fb;padding:10px;border-radius:10px;margin:6px 0}.filler{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;padding:6px 0}.filler input{width:100%;border:1px solid #ccd4e4;border-radius:9px;padding:7px}.review{display:grid;grid-template-columns:28px 1fr 85px;gap:8px;align-items:center;border-bottom:1px solid #eef0f5;padding:8px 0}.review input{border:1px solid #ccd4e4;border-radius:9px;padding:7px;width:100%}@media(max-width:620px){.app{padding:0 10px 32px}header{margin:0 -10px 14px;padding:13px 14px}.controls{grid-template-columns:1fr 1fr}.controls .field:last-child{grid-column:span 2}.meal-grid{grid-template-columns:1fr}.recipes{gap:8px}.recipe{padding:10px}.dish{width:40px;height:40px;font-size:24px}.recipe h3{font-size:13px}.ing-total{font-size:16px}.ing{font-size:12px;padding:3px 6px}.stat{padding:8px}.stat b{font-size:18px}}

<div class="app"><header><div class="top"><div class="brand"><h1>Sleep Kitchen Planner</h1><p>Private meal and ingredient planner</p></div><button id="gear" class="gear" aria-label="Settings">⚙</button></div><nav class="tabs"><button data-tab="today">Today</button><button data-tab="plan">Plan</button><button data-tab="recipes">Recipes</button><button data-tab="ingredients">Ingredients</button></nav></header><main id="content"></main></div>
<div id="backdrop" class="backdrop"></div><aside id="drawer" class="drawer"></aside><div id="modalBack" class="modal-back"><div id="modal" class="modal"></div></div>
<script>
const ingredients=[['apple','🍎','Fancy Apple'],['milk','🥛','Moomoo Milk'],['honey','🍯','Honey'],['sausage','🥓','Bean Sausage'],['potato','🥔','Soft Potato'],['tomato','🍅','Snoozy Tomato'],['herb','🌿','Fiery Herb'],['egg','🥚','Fancy Egg'],['oil','🫒','Pure Oil'],['ginger','🫚','Warm Ginger'],['mushroom','🍄','Tasty Mushroom'],['corn','🌽','Greengrass Corn'],['cacao','🫘','Soothing Cacao'],['pumpkin','🎃','Grubbin Pumpkin'],['leek','🌱','Large Leek'],['tails','🦐','Slowpoke Tail'],['soy','🫛','Greengrass Soybeans'],['coffee','☕','Rousing Coffee'],['avocado','🥑','Glossy Avocado']].map(([id,icon,name])=>({id,icon,name}));const I=Object.fromEntries(ingredients.map(x=>[x.id,x]));
/* Starter catalog: expand/replace this array with verified full recipe data. */
const recipes=[
{id:'fancy-apple',name:'Fancy Apple Curry',cat:'Curry / Stew',dish:'🍛',base:668,ings:{apple:7}},{id:'simple-chowder',name:'Simple Chowder',cat:'Curry / Stew',dish:'🥣',base:727,ings:{milk:7}},{id:'mild-honey',name:'Mild Honey Curry',cat:'Curry / Stew',dish:'🍛',base:749,ings:{honey:7}},{id:'beanburger',name:'Beanburger Curry',cat:'Curry / Stew',dish:'🍛',base:764,ings:{sausage:7}},{id:'hearty-cheese',name:'Hearty Cheeseburger Curry',cat:'Curry / Stew',dish:'🍛',base:1785,ings:{milk:8,sausage:8}},{id:'drought-katsu',name:'“Drought” Katsu Curry',cat:'Curry / Stew',dish:'🍛',base:1815,ings:{sausage:10,oil:5}},{id:'solar-tomato',name:'“Solar Power” Tomato Curry',cat:'Curry / Stew',dish:'🍛',base:1943,ings:{tomato:10,herb:5}},{id:'melty-omelette',name:'Melty Omelette Curry',cat:'Curry / Stew',dish:'🍛',base:2009,ings:{egg:10,tomato:6}},{id:'spore-mushroom',name:'“Spore” Mushroom Curry',cat:'Curry / Stew',dish:'🍛',base:4162,ings:{mushroom:14,potato:9}},{id:'limber-corn',name:'“Limber” Corn Stew',cat:'Curry / Stew',dish:'🍛',base:4467,ings:{corn:14,milk:8,potato:8}},{id:'ninja-curry',name:'Ninja Curry',cat:'Curry / Stew',dish:'🍛',base:9445,ings:{soy:24,sausage:9,leek:12,mushroom:5}},{id:'grilled-tail',name:'Grilled Tail Curry',cat:'Curry / Stew',dish:'🍛',base:7483,ings:{tails:8,herb:25}},{id:'bounce-udon',name:'“Bounce” Curry Udon',cat:'Curry / Stew',dish:'🍜',base:25539,ings:{ginger:39,mushroom:31,herb:22,sausage:20}},{id:'overgrow-avocado',name:'“Overgrow” Avocado Gratin',cat:'Curry / Stew',dish:'🥘',base:24802,ings:{potato:20,avocado:22,milk:41,oil:32}}
];
const levelBonus={1:0,2:2,3:4,4:6,5:8,6:10,7:12,8:14,9:16,10:18,11:19,12:21,13:23,14:25,15:27,16:28,17:30,18:32,19:33,20:35,21:38,22:40,23:43,24:45,25:48,26:51,27:53,28:56,29:58,30:61};
const defaultState={tab:'today',pot:32,category:'Curry / Stew',showOver:true,enabled:Object.fromEntries(ingredients.map(x=>[x.id,!['leek','tails','coffee'].includes(x.id)])),inventory:Object.fromEntries(ingredients.map(x=>[x.id,0])),levels:{},plans:{},selectedSlot:null};defaultState.inventory={...defaultState.inventory,apple:22,milk:18,honey:12,sausage:17,potato:8,tomato:16,herb:8,egg:12,oil:10,ginger:4,mushroom:8,corn:3};let state=JSON.parse(localStorage.getItem('sleepKitchenV2')||'null')||structuredClone(defaultState);state.enabled??=structuredClone(defaultState.enabled);state.levels??={};state.plans??={};
const save=()=>localStorage.setItem('sleepKitchenV2',JSON.stringify(state));const total=r=>Object.values(r.ings).reduce((a,b)=>a+b,0);const recipe=id=>recipes.find(r=>r.id===id);const powered=r=>{let lv=state.levels[r.id];return lv?Math.round(r.base*(1+(levelBonus[lv]||0)/100)):r.base};const allowed=r=>Object.keys(r.ings).every(id=>state.enabled[id]);const iconList=ings=>Object.entries(ings).map(([id,q])=>`<span class="ing" title="${I[id].name}">${I[id].icon} ${q}</span>`).join('');function day(n){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}function dk(d){return d.toISOString().slice(0,10)}function label(n){return n===0?'Today':n===1?'Tomorrow':day(n).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}function slots(range=7){let out=[];for(let d=0;d<range;d++)for(const meal of ['Breakfast','Lunch','Dinner'])out.push({day:d,meal,label:label(d),key:dk(day(d))+'-'+meal});return out}function needs(range=7){let n={};slots(range).forEach(s=>{let p=state.plans[s.key];if(p&&!p.cooked){let r=recipe(p.recipe);Object.entries(r.ings).forEach(([id,q])=>n[id]=(n[id]||0)+q)}});return n}function shortageTimeline(){let bal={...state.inventory},out=[];slots(7).forEach(s=>{let p=state.plans[s.key];if(!p||p.cooked)return;Object.entries(recipe(p.recipe).ings).forEach(([id,q])=>{bal[id]=(bal[id]||0)-q;if(bal[id]<0&&!out.some(x=>x.id===id))out.push({id,short:-bal[id],slot:s})})});return out}
function recipeCard(r,selectable=true){let over=total(r)>state.pot;return `<article class="recipe ${over?'over':''}"><div class="recipe-top"><div class="dish">${r.dish}</div><div><h3>${r.name}</h3><div class="category">${r.cat}</div></div></div><div class="ing-total">${total(r)} INGREDIENTS</div><div class="power">Lv. ${state.levels[r.id]||'—'} · Recipe Strength: <b>${powered(r).toLocaleString()}</b></div><div class="ings">${iconList(r.ings)}</div>${selectable?`<button class="primary select" data-pick="${r.id}">Select recipe</button>`:''}</article>`}
function setTab(t){state.tab=t;save();render()}function render(){document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.tab);b.onclick=()=>setTab(b.dataset.tab)});let c=document.getElementById('content');c.innerHTML=state.tab==='today'?today():state.tab==='plan'?plan():state.tab==='recipes'?recipeView():ingredientsView();bind()}
function today(){let n=needs(1),missing=Object.entries(n).reduce((a,[id,q])=>a+Math.max(0,q-(state.inventory[id]||0)),0),short=shortageTimeline().slice(0,4);return `<div class="panel"><h2 class="title">Today <small>${day(0).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</small></h2><div class="controls"><div class="field"><label>Weekly category</label><select id="cat"><option>Curry / Stew</option><option>Salad</option><option>Dessert / Drink</option></select></div><div class="field"><label>Normal pot capacity</label><input id="pot" type="number" min="1" max="200" value="${state.pot}"></div><div class="field"><label>Recipe catalog</label><input value="Accessible recipes" disabled></div></div></div><div class="stats"><div class="stat"><b>${Object.values(n).reduce((a,b)=>a+b,0)}</b><span>Ingredients needed today</span></div><div class="stat"><b>${missing}</b><span>Missing for remaining meals</span></div><div class="stat"><b>${slots(7).filter(s=>state.plans[s.key]&&!state.plans[s.key].cooked).length}</b><span>Upcoming planned meals</span></div></div><div class="panel"><h2 class="title">Remaining meals <small>All choices stay editable until cooked</small></h2><div class="meal-grid">${slots(1).map(mealCard).join('')}</div></div><div class="panel"><h2 class="title">Plan ahead <small>First shortages in your next 7 days</small></h2>${short.length?`<div class="priority-list">${short.map(x=>`<div class="priority"><span class="emoji">${I[x.id].icon}</span><div><div class="name">${I[x.id].name}</div><div class="sub">Need ${x.short} more by ${x.slot.label} ${x.slot.meal}</div></div><span class="badge ${x.slot.day<2?'urgent':''}">${x.slot.day===0?'Today':x.slot.day===1?'Tomorrow':'Later'}</span></div>`).join('')}</div>`:'<div class="empty">Your current planned base recipes are covered.</div>'}<div class="row" style="margin-top:12px"><button class="secondary" data-go="ingredients">Full ingredient timeline</button></div></div>`}
function mealCard(s){let p=state.plans[s.key],r=p&&recipe(p.recipe);return `<div class="meal"><h3>${s.meal}</h3>${r?`<div class="meal-name">${r.dish} ${r.name}</div><div class="status">${p.cooked?'Cooked':'Planned'} · ${total(r)} ingredients</div><div class="row">${p.cooked?'<button class="secondary" disabled>Cooked</button>':`<button class="primary" data-cook="${s.key}">Mark cooked</button>`}<button class="secondary" data-select="${s.key}">Change</button></div>`:`<div class="meal-name">No recipe selected</div><div class="status">Choose a recipe</div><button class="primary" data-select="${s.key}">Select recipe</button>`}</div>`}
function plan(){return slots(7).reduce((html,s,i)=>{if(i%3===0)html+=`<div class="panel"><h2 class="title">${s.label}<small>${day(s.day).toLocaleDateString(undefined,{weekday:'long'})}</small></h2><div class="meal-grid">`;html+=mealCard(s);if(i%3===2)html+='</div></div>';return html},'')}
function recipeView(){return `<div class="panel"><h2 class="title">Recipes <small>Only recipes using enabled ingredients</small></h2><div class="toolbar"><input id="search" placeholder="Search recipes…"><label class="toggle"><input id="makeable" type="checkbox"> What can I make?</label><select id="sort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select><button class="secondary" id="master">Master list</button></div><div id="recipeGrid" class="recipes"></div></div>`}function drawRecipes({master=false,target='recipeGrid',picker=false}={}){let root=document.getElementById(target),q=(document.getElementById(picker?'pickerSearch':'search')?.value||'').toLowerCase(),makeable=document.getElementById(picker?'pickerMakeable':'makeable')?.checked,sort=document.getElementById(picker?'pickerSort':'sort')?.value||'power';let list=recipes.filter(r=>(master||allowed(r))&&r.name.toLowerCase().includes(q));if(!master&&!state.showOver)list=list.filter(r=>total(r)<=state.pot);if(makeable)list=list.filter(r=>total(r)<=state.pot&&Object.entries(r.ings).every(([id,n])=>(state.inventory[id]||0)>=n));list.sort((a,b)=>sort==='power'?powered(b)-powered(a):sort==='ingredients'?total(b)-total(a):a.name.localeCompare(b.name));root.innerHTML=list.length?list.map(r=>recipeCard(r,!master)).join(''):'<div class="empty">No recipes match these filters.</div>';root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>chooseRecipe(b.dataset.pick))}
function ingredientsView(){let n=needs(),surplus=ingredients.map(x=>({x,q:Math.max(0,(state.inventory[x.id]||0)-(n[x.id]||0))})).filter(x=>x.q>0),short=shortageTimeline();return `<div class="panel"><h2 class="title">Ingredient inventory <small>Update manually or import screenshots</small></h2><div class="row"><button class="primary" id="upload">Upload bag screenshots</button><button class="secondary" id="openDrawer">Ingredient settings</button></div><p class="hint">Screenshot import is a local review workflow in this prototype: select screenshots, then confirm/edit the detected counts before saving.</p><div class="inventory-list">${ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="inventory-row"><span class="emoji">${x.icon}</span><label>${x.name}</label><input data-inv="${x.id}" type="number" min="0" value="${state.inventory[x.id]||0}"></div>`).join('')}</div><div class="footer"><button class="primary" id="saveInventory">Save inventory</button></div></div><div class="panel"><h2 class="title">Ingredient timeline <small>Bag versus unfinished planned base recipes</small></h2>${short.length?`<div class="priority-list">${short.map(x=>`<div class="priority"><span class="emoji">${I[x.id].icon}</span><div><div class="name">${I[x.id].name}</div><div class="sub">Short ${x.short} starting ${x.slot.label} ${x.slot.meal}</div></div><span class="badge ${x.slot.day<2?'urgent':''}">${x.slot.day===0?'Today':x.slot.day===1?'Tomorrow':'Later'}</span></div>`).join('')}</div>`:'<div class="empty">No shortages in the selected seven-day plan.</div>'}</div><div class="panel"><h2 class="title">Filler surplus <small>Current bag minus planned base recipes</small></h2>${surplus.length?`<div class="ings">${surplus.map(({x,q})=>`<span class="ing" title="${x.name}">${x.icon} ${q}</span>`).join('')}</div>`:'<div class="empty">No filler surplus right now.</div>'}</div>`}
function bind(){document.getElementById('gear').onclick=openDrawer;document.getElementById('openDrawer')&&(document.getElementById('openDrawer').onclick=openDrawer);document.getElementById('cat')?.addEventListener('change',e=>{state.category=e.target.value;save();render()});document.getElementById('cat')&&(document.getElementById('cat').value=state.category);document.getElementById('pot')?.addEventListener('change',e=>{state.pot=Math.max(1,+e.target.value||1);save();render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>openPicker(b.dataset.select));document.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>openCook(b.dataset.cook));if(state.tab==='recipes'){drawRecipes();['search','makeable','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',()=>drawRecipes()));document.getElementById('master').onclick=openMaster}document.getElementById('saveInventory')?.addEventListener('click',()=>{document.querySelectorAll('[data-inv]').forEach(el=>state.inventory[el.dataset.inv]=Math.max(0,+el.value||0));save();render()});document.getElementById('upload')?.addEventListener('click',openUpload)}
function openDrawer(){let enabled=ingredients.filter(x=>state.enabled[x.id]).length;document.getElementById('drawer').innerHTML=`<div class="drawer-head"><h2>Settings</h2><button id="closeDrawer" class="close">×</button></div><div class="field"><label>Weekly category</label><select id="dcat"><option>Curry / Stew</option><option>Salad</option><option>Dessert / Drink</option></select></div><div class="divider"></div><div class="field"><label>Normal cooking pot size</label><div class="stepper"><button id="minus">−</button><input id="dpot" type="number" min="1" max="200" value="${state.pot}"><button id="plus">+</button></div></div><div class="divider"></div><label class="toggle"><input id="showOver" type="checkbox" ${state.showOver?'checked':''}> Show recipes over normal pot size</label><div class="divider"></div><h3 style="margin:0 0 6px">Available ingredients</h3><p class="hint">${enabled} / ${ingredients.length} enabled. Disabled ingredients hide their recipes from normal browsing, meal selection, and “What can I make?” They remain in the Master List.</p><div class="checks">${ingredients.map(x=>`<label class="check"><input type="checkbox" data-enabled="${x.id}" ${state.enabled[x.id]?'checked':''}> <span>${x.icon} ${x.name}</span></label>`).join('')}</div><div class="divider"></div><div class="row"><button class="secondary" id="drawerMaster">Master recipe list</button><button class="secondary" id="drawerUpload">Import screenshots</button></div><div class="divider"></div><p class="hint">Private data is stored only in this browser.</p><div class="row"><button class="secondary" id="export">Export backup</button><label class="secondary">Import backup<input id="import" type="file" accept="application/json" hidden></label><button class="danger" id="reset">Reset</button></div>`;document.getElementById('dcat').value=state.category;document.getElementById('drawer').classList.add('show');document.getElementById('backdrop').classList.add('show');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('backdrop').onclick=closeDrawer;document.getElementById('minus').onclick=()=>{state.pot=Math.max(1,state.pot-1);save();openDrawer();render()};document.getElementById('plus').onclick=()=>{state.pot++;save();openDrawer();render()};document.getElementById('dpot').onchange=e=>{state.pot=Math.max(1,+e.target.value||1);save();render()};document.getElementById('dcat').onchange=e=>{state.category=e.target.value;save();render()};document.getElementById('showOver').onchange=e=>{state.showOver=e.target.checked;save();render()};document.querySelectorAll('[data-enabled]').forEach(el=>el.onchange=()=>{state.enabled[el.dataset.enabled]=el.checked;save();openDrawer();render()});document.getElementById('drawerMaster').onclick=()=>{closeDrawer();openMaster()};document.getElementById('drawerUpload').onclick=()=>{closeDrawer();openUpload()};document.getElementById('export').onclick=exportData;document.getElementById('import').onchange=importData;document.getElementById('reset').onclick=()=>{if(confirm('Reset all local app data?')){state=structuredClone(defaultState);save();closeDrawer();render()}}}function closeDrawer(){document.getElementById('drawer').classList.remove('show');document.getElementById('backdrop').classList.remove('show')}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBack').classList.add('show');document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}}function closeModal(){document.getElementById('modalBack').classList.remove('show')}function openMaster(){openModal(`<h2>Master Recipe List</h2><p class="hint">All catalog recipes appear here, including recipes that need disabled ingredients. Master-list cards are reference-only.</p><div class="toolbar"><input id="search" placeholder="Search master list…"><select id="sort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select></div><div id="recipeGrid" class="recipes"></div><div class="footer"><button id="closeMaster" class="secondary">Close</button></div>`);drawRecipes({master:true});document.getElementById('search').oninput=()=>drawRecipes({master:true});document.getElementById('sort').onchange=()=>drawRecipes({master:true});document.getElementById('closeMaster').onclick=closeModal}
function openPicker(slot){state.selectedSlot=slot;let s=slots(7).find(x=>x.key===slot);openModal(`<h2>Select recipe for ${s.label} ${s.meal}</h2><div class="toolbar"><input id="pickerSearch" placeholder="Search accessible recipes…"><label class="toggle"><input id="pickerMakeable" type="checkbox"> What can I make?</label><select id="pickerSort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select></div><div id="pickerGrid" class="recipes"></div><div class="footer"><button id="cancelPicker" class="secondary">Cancel</button></div>`);drawRecipes({target:'pickerGrid',picker:true});['pickerSearch','pickerMakeable','pickerSort'].forEach(id=>document.getElementById(id).addEventListener(id==='pickerSearch'?'input':'change',()=>drawRecipes({target:'pickerGrid',picker:true})));document.getElementById('cancelPicker').onclick=closeModal}
function chooseRecipe(id){if(!state.selectedSlot){alert('Select a meal slot first.');return}state.plans[state.selectedSlot]={recipe:id,cooked:false};save();closeModal();render()}
function openCook(slot){let p=state.plans[slot],r=recipe(p.recipe);openModal(`<h2>Mark cooked</h2><p class="hint">Confirm the base recipe and enter only the filler quantities you actually used. Filler strength is not calculated.</p><h3>Base recipe</h3>${Object.entries(r.ings).map(([id,q])=>`<div class="base">${I[id].icon} ${I[id].name}: <b>${q}</b></div>`).join('')}<h3>Add fillers used</h3>${ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="filler"><label>${x.icon} ${x.name}</label><input data-fill="${x.id}" type="number" min="0" value="0"></div>`).join('')}<div class="footer"><button id="cancelCook" class="secondary">Cancel</button><button id="confirmCook" class="primary">Confirm cooked</button></div>`);document.getElementById('cancelCook').onclick=closeModal;document.getElementById('confirmCook').onclick=()=>{let used={...r.ings};document.querySelectorAll('[data-fill]').forEach(el=>{let q=Math.max(0,+el.value||0);if(q)used[el.dataset.fill]=(used[el.dataset.fill]||0)+q});Object.entries(used).forEach(([id,q])=>state.inventory[id]=Math.max(0,(state.inventory[id]||0)-q));p.cooked=true;save();closeModal();render()}}
function openUpload(){openModal(`<h2>Import bag screenshots</h2><p class="hint">Choose one or more Pokémon Sleep ingredient-bag screenshots. This prototype provides the private review and correction flow; automatic icon/count recognition can be connected next. For now, select images, then confirm the values you want to update.</p><input id="shots" type="file" accept="image/*" multiple><div id="preview" class="hint" style="margin-top:10px"></div><div id="reviewRows" style="margin-top:10px"></div><div class="footer"><button id="cancelUpload" class="secondary">Cancel</button><button id="applyUpload" class="primary">Apply confirmed counts</button></div>`);document.getElementById('cancelUpload').onclick=closeModal;document.getElementById('shots').onchange=e=>{let files=[...e.target.files];document.getElementById('preview').textContent=files.length?`${files.length} screenshot${files.length>1?'s':''} selected. Enter the counts visible in the screenshots below.`:'No screenshots selected.';document.getElementById('reviewRows').innerHTML=ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="review"><span class="emoji">${x.icon}</span><label>${x.name}</label><input data-import="${x.id}" type="number" min="0" value="${state.inventory[x.id]||0}"></div>`).join('')};document.getElementById('applyUpload').onclick=()=>{document.querySelectorAll('[data-import]').forEach(el=>state.inventory[el.dataset.import]=Math.max(0,+el.value||0));save();closeModal();render()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='sleep-kitchen-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);state.enabled??=structuredClone(defaultState.enabled);save();closeDrawer();render();alert('Backup imported.')}catch{alert('That file could not be read as a backup.')}};r.readAsText(f)}
render();
</script></body></html>
